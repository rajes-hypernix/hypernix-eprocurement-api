services:
  db:
    image: postgres:16
    container_name: eprocure-db
    environment:
      POSTGRES_USER: eprocure
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: eprocure
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eprocure"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
