function bRecordFromDraft(d,status){
  return {id:d.id,title:d.title||'Untitled RFQ',envelope:d.envelope,status,created:'28/06/2026',
    closes:(d.closes||'').split('-').reverse().join('/'),_draftClose:d.closes,prRefs:d.prRefs,
    evaluators:d.evaluators,commercialEvaluators:d.evalCommercial||[],openedCommercial:false,openedTechnical:false,

function bPersist(d,status){const ix=DATA.rfqs.findIndex(r=>r.id===d.id);const rec=bRecordFromDraft(d,status);if(ix>=0){DATA.rfqs[ix]=Object.assign({},DATA.rfqs[ix],rec);}else{DATA.rfqs.unshift(rec);}return rec;}
function bSaveDraft(){const d=S.draft;if(!d)return;if(!d.id)d.id='RFQ-2026-0'+(100+Math.floor(Math.random()*899));bPersist(d,'draft');toast('Draft saved \u00b7 '+d.id);render();}
function bConfirmRelease(){const d=S.draft;if(!d)return;if(!d.invited||!d.invited.length){toast('Invite at least one vendor before releasing');return;}const qn=d.form?d.form.items.filter(x=>x.kind==='question').length:0;
  openModal(`<div class="mhead">${I('send',20,'var(--teal)')}<h3>Release RFQ to Vendors</h3></div>
    <div class="mbody"><p class="hint" style="margin-top:0">Once released, the invited vendors can see this RFQ and start bidding. Line items and questions are locked after release \u2014 you can still send clarifications.</p>
    <div class="locked-note"><b>${d.title||'Untitled RFQ'}</b><br>${d.lines.length} line(s) \u00b7 ${qn} question(s) \u00b7 ${d.invited.length} vendor(s) \u00b7 closes ${(d.closes||'').split('-').reverse().join('/')}</div></div>
    <div class="mfoot"><button class="btn btn-out" onclick="closeModal()">Not yet</button><button class="btn btn-pri" onclick="closeModal();bSend()">${I('send',15,'#fff')} Release now</button></div>`);
}
function bSend(){
  const d=S.draft;if(!d)return;
  if(!d.id)d.id='RFQ-2026-0'+(100+Math.floor(Math.random()*899));

  S.selPRs.clear();S.reqGroup={};S.lineSel={};S.draft=null;S.rfqId=id;S.procScreen='rfq';
  toast('RFQ '+id+' released to '+n+' vendor(s)');render();
}
function bEditDraft(id){const r=rfqById(id);if(!r)return;
  S.draft={id:r.id,title:(r.title==='Untitled RFQ'?'':r.title),envelope:r.envelope,opens:'2026-06-28',
    closes:(r._draftClose||((r.closes||'').split('/').reverse().join('-'))),currency:'MYR',prRefs:r.prRefs||[],
    lines:r.lines||[],form:r.form||defaultForm(),formName:'Standard Technical Questionnaire',
    invited:r.invited||[],evaluators:r.evaluators||[],evalCommercial:r.commercialEvaluators||[]};

}

      ${r.envelope==='dual'?`<span class="badge b-blue">Bids sealed until opened</span>`:''}</div>

        <td>${sub?`<span class="badge b-green">Submitted</span>`:`<span class="badge b-amber">Awaiting</span>`}</td>
        <td>${sub?'Sealed':'—'}</td></tr>`;}).join('')}</tbody></table></div>
    <div class="card" style="margin-top:16px"><div class="chead"><h3>Line Items</h3></div>
      <table><thead><tr><th>Code</th><th>Item</th><th class="amt">Qty</th><th>UoM</th></tr></thead>

function demoCloseBids(id){
  const r=rfqById(id);r.status='closed';
  // seed sample bids if none
  if(!DATA.bids[id]||Object.keys(DATA.bids[id]).length===0) DATA.bids[id]=sampleBidsFor(r);
  toast('Bid window closed — ready to open');render();
}
function sampleBidsFor(r){
  const out={};
  r.invited.forEach((vid,k)=>{
    const lines={};r.lines.forEach((l,i)=>{lines[l.code]={bid:!(k===2&&i===0),price:Math.round((l.qty?500+i*120+k*40:600))*1,qty:l.qty,partial:false};});
    out[vid]={submitted:true,lead:6+k,warranty:18+k*3,lines,
      answers:r.questions.map((q,qi)=>['Confirmed.',''+(6+k)+' weeks.','Yes — local stock.'][qi]||'Confirmed.'),
      files:[{n:['Technical_Compliance.pdf','Compliance_EN10204.pdf','QA_Certificate.pdf'][k%3]}],techScore:90-k*7};
  });
  return out;
}

function tryOpen(id,which){

/* ---- Technical scoring (two-envelope evaluation) ---- */
function submittedVids(r){const b=DATA.bids[r.id]||{};return r.invited.filter(v=>b[v]&&b[v].submitted);}
function techState(r){r.techScores=r.techScores||{};return r.techScores;}
function picWeighted(r,vid,ev){const sc=(r.techScores&&r.techScores[vid]&&r.techScores[vid][ev])||null;if(!sc)return null;let sum=0;for(const c of TECH_CRITERIA){const val=sc[c.key];if(val===''||val==null||isNaN(val))return null;sum+=Number(val)*c.weight;}return sum/100;}
function techOverall(r,vid){if(!r.evaluators)return null;const vals=r.evaluators.map(ev=>picWeighted(r,vid,ev)).filter(x=>x!=null);if(!vals.length)return null;return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10;}
function techPass(r,vid){const o=techOverall(r,vid);return o!=null&&o>=TECH_THRESHOLD;}
function techFinalized(r){return !!r.techFinal;}
function techScoreCell(r,vid,finalized){const o=techOverall(r,vid);if(o==null)return '<span class="hint">\u2014</span>';const pass=o>=TECH_THRESHOLD;return `<div style="font-weight:800;font-size:15px;color:${pass?'#2f9e6e':'#cf5149'}">${o}</div>`+(finalized?`<div class="hint" style="font-weight:700;color:${pass?'#2f9e6e':'#cf5149'}">${pass?'PASS':'FAIL'}</div>`:`<div class="hint">vs ${TECH_THRESHOLD} req</div>`);}
function setScore(rid,vid,ev,crit,val){const r=rfqById(rid);const ts=techState(r);ts[vid]=ts[vid]||{};ts[vid][ev]=ts[vid][ev]||{};ts[vid][ev][crit]=(val===''?'':Math.max(0,Math.min(100,Number(val)||0)));const pw=document.getElementById('pw_'+vid);if(pw){const w=picWeighted(r,vid,ev);pw.innerHTML=(w==null?'<span class="hint">incomplete</span>':w.toFixed(1));}const tc=document.getElementById('tsum_'+vid);if(tc)tc.innerHTML=techScoreCell(r,vid,false);}
function setEvalAs(v){S.evalAs=v;render();}
function finalizeTech(rid){const r=rfqById(rid);const vids=submittedVids(r);if(!vids.length){toast('No submitted bids to score');return;}const ok=vids.every(v=>(r.evaluators||[]).some(ev=>picWeighted(r,v,ev)!=null));if(!ok){toast('Each vendor needs an evaluator scored on all criteria');return;}r.techFinal=true;toast('Technical finalized \u2014 '+vids.filter(v=>!techPass(r,v)).length+' vendor(s) failed');render();}
function releaseCommercial(rid){const r=rfqById(rid);if(!techFinalized(r)){toast('Finalize technical first');return;}r.openedCommercial=true;r.status='evaluation';toast('Commercial envelopes opened for passed vendors');openRFQ(rid);}
function procTechEval(r){
  if(!r){goProc('rfqs');return;}
  const bids=DATA.bids[r.id]||{};const vids=submittedVids(r);const ts=techState(r);
  if(!r.evaluators||!r.evaluators.length){$('main').innerHTML=`<div class="crumb"><a onclick="openRFQ('${r.id}')">${r.id}</a> ${I('chev',13)} <span>Technical scoring</span></div><div class="card"><div class="cbody"><p class="hint">No evaluators were assigned to this RFQ.</p></div></div>`;return;}
  if(!S.evalAs||!r.evaluators.includes(S.evalAs))S.evalAs=r.evaluators[0];
  const pic=S.evalAs;const finalized=techFinalized(r);
  const techItems=rfqForm(r).items.filter(it=>it.group==='technical'&&it.kind==='question');
  const ansTbl=(techItems.length&&vids.length)?`<div class="card" style="margin-bottom:16px"><div class="chead"><h3>Technical Responses</h3><div class="spacer"></div><span class="hint">read-only \u00b7 for reference</span></div><div class="cbody"><div class="comp-wrap"><table class="comp"><thead><tr><th style="min-width:230px">Question</th>${vids.map(v=>`<th class="vcol">${vName(v)}</th>`).join('')}</tr></thead><tbody>${techItems.map(it=>`<tr><td style="font-weight:600;max-width:240px;white-space:normal">${qesc(it.label)||'Untitled'}</td>${vids.map(v=>`<td class="vcol" style="white-space:normal">${vbAnswerText(it,bids[v])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div></div>`:'';
  const picOptions=r.evaluators.map(e=>{const ev=DATA.evaluators.find(x=>x.id===e);const done=vids.length&&vids.every(v=>picWeighted(r,v,e)!=null);return `<option value="${e}" ${e===pic?'selected':''}>${ev.name} \u00b7 ${ev.area}${done?' \u2713':''}</option>`;}).join('');
  const header=`<tr><th style="min-width:230px">Evaluation criterion</th>${vids.map(v=>`<th class="vcol" style="text-align:center">${vName(v)}</th>`).join('')}</tr>`;
  const critRows=TECH_CRITERIA.map(c=>`<tr><td><div style="font-weight:600">${c.label}</div><div class="hint">Weight ${c.weight}%</div></td>${vids.map(v=>{const sc=(ts[v]&&ts[v][pic])||{};const val=sc[c.key]==null?'':sc[c.key];return `<td class="vcol" style="text-align:center">${finalized?`<strong>${val===''?'\u2014':val}</strong>`:`<input type="number" class="scoreinput" min="0" max="100" value="${val}" oninput="setScore('${r.id}','${v}','${pic}','${c.key}',this.value)">`}</td>`;}).join('')}</tr>`).join('');
  const picRow=`<tr style="background:var(--soft)"><td style="font-weight:700">Your weighted score</td>${vids.map(v=>{const w=picWeighted(r,v,pic);return `<td class="vcol" style="text-align:center;font-weight:700" id="pw_${v}">${w==null?'<span class="hint">incomplete</span>':w.toFixed(1)}</td>`;}).join('')}</tr>`;
  const sumRow=`<tr><td style="font-weight:700">Committee score <span class="hint">avg of ${r.evaluators.length} evaluator(s)</span></td>${vids.map(v=>`<td class="vcol" style="text-align:center" id="tsum_${v}">${techScoreCell(r,v,finalized)}</td>`).join('')}</tr>`;
  $('main').innerHTML=`
    <div class="crumb"><a onclick="goProc('rfqs')">RFQs</a> ${I('chev',13)} <a onclick="openRFQ('${r.id}')">${r.id}</a> ${I('chev',13)} <span>Technical scoring</span></div>
    <div class="pagehead"><div><h1>Technical Evaluation \u2014 ${r.id}</h1><p>${r.title} \u00b7 sealed technical envelope</p></div><div class="spacer"></div><button class="btn btn-out" onclick="openRFQ('${r.id}')">${I('back',14)} Back to RFQ</button></div>
    ${maskNote()}<div class="ribbon"><span class="ns">${I('lock',12,'#fff')}</span> Score the technical envelope first. Commercial (price) envelopes release only for vendors scoring \u2265 ${TECH_THRESHOLD}.</div>
    ${vids.length?'':'<div class="card"><div class="cbody"><p class="hint">No bids submitted yet.</p></div></div>'}
    ${ansTbl}
    <div class="card" style="margin-bottom:16px"><div class="chead"><h3>Scoring Matrix</h3><div class="spacer"></div>${finalized?'<span class="badge b-green">Technical finalized</span>':`<span class="hint" style="margin-right:8px">Scoring as</span><select onchange="setEvalAs(this.value)" style="max-width:240px">${picOptions}</select>`}</div><div class="cbody"><div class="comp-wrap"><table class="comp"><thead>${header}</thead><tbody>${critRows}${picRow}${sumRow}</tbody></table></div></div></div>
    ${finalized?`<div class="card"><div class="cbody" style="display:flex;align-items:center;gap:14px"><div style="flex:1"><strong>Technical evaluation finalized.</strong> <span class="hint">${vids.filter(v=>!techPass(r,v)).length} vendor(s) did not pass \u2014 excluded from commercial.</span></div>${r.openedCommercial?`<button class="btn btn-out" onclick="openRFQ('${r.id}')">View comparison ${I('chev',14)}</button>`:`<button class="btn btn-pri" onclick="releaseCommercial('${r.id}')">${I('unlock',15,'#fff')} Open commercial envelopes</button>`}</div></div>`:`<div style="display:flex;justify-content:flex-end"><button class="btn btn-pri" onclick="finalizeTech('${r.id}')">${I('check',15,'#fff')} Finalize technical &amp; gate commercial</button></div>`}`;
}
/* ---- Comparison block (centerpiece) ---- */
function comparisonBlock(r){
  const bids=DATA.bids[r.id]||{};
  const dual=r.envelope==='dual';
  const subVids=r.invited.filter(v=>bids[v]&&bids[v].submitted);
  const techFinal=techFinalized(r);
  const commOpen=r.openedCommercial;
  const progressed=(dual&&techFinal)?subVids.filter(v=>techPass(r,v)):subVids;
  const totalFor=v=>r.lines.reduce((s,l)=>{const c=bids[v].lines[l.code];return s+(c&&c.bid?c.price*c.qty:0);},0);
  const qItems=g=>rfqForm(r).items.filter(it=>it.group===g&&it.kind==='question');
  const qaTable=(items,cols)=>`<div class="comp-wrap"><table class="comp"><thead><tr><th style="min-width:230px">Question</th>${cols.map(v=>`<th class="vcol">${vName(v)}</th>`).join('')}</tr></thead><tbody>${items.map(it=>`<tr><td style="font-weight:600;max-width:240px;white-space:normal">${qesc(it.label)||'Untitled'}</td>${cols.map(v=>`<td class="vcol" style="white-space:normal">${vbAnswerText(it,bids[v])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  // ===== Technical =====
  let tech='';
  if(dual){
    const cta=techFinal?`<button class="btn btn-out btn-sm" onclick="S.procScreen='techeval';S.rfqId='${r.id}';render()">View technical scoring</button>`:`<button class="btn btn-pri btn-sm" onclick="S.procScreen='techeval';S.rfqId='${r.id}';render()">${I('edit',13,'#fff')} Score technical</button>`;
    const rows=subVids.map(v=>{const o=techOverall(r,v);const pass=techPass(r,v);return `<tr><td style="font-weight:600">${vName(v)}</td><td class="vcol" style="text-align:center;font-weight:800;color:${o==null?'var(--muted)':(pass?'#2f9e6e':'#cf5149')}">${o==null?'\u2014':o}</td><td class="vcol" style="text-align:center">${o==null?'<span class="hint">not scored</span>':(techFinal?`<span class="badge ${pass?'b-green':'b-red'}">${pass?'Pass':'Fail'}</span>`:`<span class="hint">vs ${TECH_THRESHOLD} req</span>`)}</td></tr>`;}).join('');
    tech=`<div class="card" style="margin-bottom:16px"><div class="chead"><h3>Technical Evaluation</h3><div class="spacer"></div>${cta}</div><div class="cbody"><div class="comp-wrap"><table class="comp"><thead><tr><th style="min-width:200px">Vendor</th><th class="vcol" style="text-align:center">Technical score</th><th class="vcol" style="text-align:center">Result</th></tr></thead><tbody>${rows||'<tr><td colspan="3"><span class="hint">No submitted bids.</span></td></tr>'}</tbody></table></div>${techFinal?`<p class="hint" style="margin-top:10px">${progressed.length} of ${subVids.length} vendor(s) passed (\u2265 ${TECH_THRESHOLD}) and progress to commercial.</p>`:'<p class="hint" style="margin-top:10px">Commercial pricing stays sealed until technical is finalized.</p>'}</div></div>`;
    if(r.openedTechnical&&qItems('technical').length)tech+=`<div class="card" style="margin-bottom:16px"><div class="chead"><h3>Technical Responses</h3></div><div class="cbody">${qaTable(qItems('technical'),subVids)}</div></div>`;
  }

  // ===== Commercial =====
  const lineRows=r.lines.map(l=>`<tr><td style="font-weight:600"><div>${l.item}</div><div class="hint">${l.code} \u00b7 ${l.qty} ${l.uom}</div></td>${progressed.map(v=>{const c=bids[v].lines[l.code];if(!c||!c.bid)return `<td class="vcol"><span class="hint">No bid</span></td>`;const best=commOpen&&progressed.every(o=>{const cc=bids[o].lines[l.code];return !(cc&&cc.bid)||c.price<=cc.price;});return `<td class="vcol ${best?'best':''}"><div class="pricecell"><span class="big ${best?'lo':''}">RM ${commOpen?fmt(c.price):'\u2022\u2022\u2022'}<span class="hint"> /${l.uom.toLowerCase()}</span></span><span class="meta">Qty ${c.qty}${c.qty<l.qty?' (partial)':''}${c.alt?` \u00b7 alt: ${c.alt}`:''}</span>${best?'<span class="badge b-green" style="margin-top:3px">Lowest</span>':''}</div></td>`;}).join('')}</tr>`).join('');
  const comm=`<div class="card" style="margin-bottom:16px"><div class="chead"><h3>Commercial Comparison</h3>${dual?'<span class="hint" style="margin-left:8px">progressed vendors</span>':''}<div class="spacer"></div>${commOpen?'<span class="badge b-green">Commercial open</span>':'<span class="badge b-blue">Commercial sealed</span>'}</div>${progressed.length?`<div class="comp-wrap"><table class="comp"><thead><tr><th style="min-width:230px">Line item</th>${progressed.map(v=>`<th class="vcol">${vName(v)}<div style="font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);margin-top:2px">${dual?`Tech ${techOverall(r,v)==null?'\u2014':techOverall(r,v)} \u00b7 `:''}Lead ${bids[v].lead}w \u00b7 Wty ${bids[v].warranty}m</div></th>`).join('')}</tr></thead><tbody>${lineRows}<tr style="background:var(--soft)"><td style="font-weight:700">Total (bid lines)</td>${progressed.map(v=>`<td class="vcol amt" style="font-weight:700;color:var(--teal)">${commOpen?'RM '+fmt(totalFor(v)):'\u2022\u2022\u2022'}</td>`).join('')}</tr></tbody></table></div>`:'<div class="cbody"><p class="hint">No vendors have progressed to commercial yet.</p></div>'}</div>`;

  let commQA='';
  if(commOpen&&qItems('commercial').length)commQA=`<div class="card" style="margin-bottom:16px"><div class="chead"><h3>Commercial Responses</h3></div><div class="cbody">${qaTable(qItems('commercial'),progressed)}</div></div>`;

  // ===== Combined ranking =====
  let award='';
  if(commOpen&&progressed.length){
    const tots=progressed.map(totalFor).filter(x=>x>0);const lo=tots.length?Math.min(...tots):0;
    const priceScoreOf=v=>{const tv=totalFor(v);return (tv>0&&lo)?Math.round(lo/tv*1000)/10:0;};
    const combinedOf=v=>dual?Math.round((TECH_WEIGHT/100*(techOverall(r,v)||0)+COMM_WEIGHT/100*priceScoreOf(v))*10)/10:priceScoreOf(v);
    const ranked=progressed.slice().sort((a,b)=>combinedOf(b)-combinedOf(a));
    const rows=ranked.map((v,i)=>`<tr><td style="text-align:center;font-weight:700">${i+1}</td><td style="font-weight:600">${vName(v)}${i===0?' <span class="badge b-green">Recommended</span>':''}</td>${dual?`<td class="vcol" style="text-align:center">${techOverall(r,v)==null?'\u2014':techOverall(r,v)}</td>`:''}<td class="vcol" style="text-align:center">${priceScoreOf(v)}</td><td class="vcol" style="text-align:center;font-weight:800;color:var(--teal)">${combinedOf(v)}</td></tr>`).join('');
    award=`<div class="card" style="margin-bottom:16px"><div class="chead"><h3>Combined Evaluation</h3><div class="spacer"></div><span class="hint">${dual?`technical ${TECH_WEIGHT}% \u00b7 commercial ${COMM_WEIGHT}%`:'lowest price'}</span></div><div class="cbody"><div class="comp-wrap"><table class="comp"><thead><tr><th style="width:50px;text-align:center">Rank</th><th>Vendor</th>${dual?'<th class="vcol" style="text-align:center">Technical</th>':''}<th class="vcol" style="text-align:center">Price score</th><th class="vcol" style="text-align:center">Combined</th></tr></thead><tbody>${rows}</tbody></table></div><p class="hint" style="margin-top:10px">Price score = lowest total \u00f7 vendor total \u00d7 100.${dual?' Combined = weighted technical + price score.':''}</p></div></div>`;
  }

  // ===== Attachments + clarifications =====
  const extra=`<div class="grid g2" style="margin-bottom:16px">
    <div class="card"><div class="chead"><h3>Attachments</h3></div><div class="cbody">${subVids.map(v=>`<div style="margin-bottom:12px"><div style="font-weight:600;font-size:12.5px;margin-bottom:6px">${vName(v)}</div>${(bids[v].files||[]).map(f=>`<div class="file"><span class="ext">${f.n.split('.').pop().toUpperCase()}</span><span style="flex:1">${f.n}</span>${I('download',16,'var(--teal)')}</div>`).join('')||'<span class="hint">No files</span>'}</div>`).join('')}</div></div>
    <div class="card"><div class="chead"><h3>Clarifications &amp; Negotiation</h3></div><div class="cbody">${subVids.map(v=>{const th=(DATA.clarifications[r.id]&&DATA.clarifications[r.id][v])||[];return `<div class="file" style="justify-content:space-between"><div><div style="font-weight:600">${vName(v)}</div><div class="hint">${th.length} message${th.length!==1?'s':''}</div></div><button class="btn btn-out btn-sm" onclick="openClarify('${r.id}','${v}')">${I('msg',14)} Open thread</button></div>`;}).join('')}</div></div>
  </div>`;

  return maskNote()+tech+comm+commQA+award+extra;
}

/* ---- Award flow ---- */
function awardableVids(r){
  const bids=DATA.bids[r.id]||{};
  let vids=r.invited.filter(v=>bids[v]&&bids[v].submitted);
  if(r.envelope==='dual'&&techFinalized(r))vids=vids.filter(v=>techPass(r,v));
  return vids;
}
function awardFlow(id){
  const r=rfqById(id);const bids=DATA.bids[id]||{};
  const vids=awardableVids(r);
  // default allocation = lowest bidder per line, full qty
  const alloc={};
  r.lines.forEach(l=>{let best=Infinity,who=vids[0];vids.forEach(v=>{const c=bids[v].lines[l.code];if(c&&c.bid&&c.price<best){best=c.price;who=v;}});alloc[l.code]={vid:who,qty:l.qty};});
  S._alloc=alloc;
  renderAward(r,vids);
}
function renderAward(r,vids){
  const bids=DATA.bids[r.id];const alloc=S._alloc;
  const rows=r.lines.map(l=>{
    const a=alloc[l.code];const c=a.vid?bids[a.vid].lines[l.code]:null;
    const opts=vids.filter(v=>bids[v].lines[l.code]&&bids[v].lines[l.code].bid)
      .map(v=>`<option value="${v}" ${a.vid===v?'selected':''}>${venById(v).name} — RM ${fmt(bids[v].lines[l.code].price)}/${l.uom.toLowerCase()}</option>`).join('');
    return `<tr>
      <td style="font-weight:600"><div>${l.item}</div><div class="hint">${l.code} · need ${l.qty} ${l.uom}</div></td>
      <td><select onchange="setAllocVendor('${l.code}',this.value)">${opts}</select></td>
      <td style="width:120px"><input type="number" value="${a.qty}" max="${l.qty}" min="0" onchange="setAllocQty('${l.code}',this.value)">
        <div class="alloc-bar"><i style="width:${Math.min(100,a.qty/l.qty*100)}%"></i></div></td>
      <td class="amt" style="font-weight:700">RM ${c?fmt(c.price*a.qty):'0.00'}</td>
    </tr>`;}).join('');
  // group totals per vendor
  const byV={};r.lines.forEach(l=>{const a=alloc[l.code];if(!a.vid)return;const c=bids[a.vid].lines[l.code];byV[a.vid]=(byV[a.vid]||0)+c.price*a.qty;});
  const grand=Object.values(byV).reduce((s,n)=>s+n,0);
  $('main').innerHTML=`
    <div class="crumb"><a onclick="goProc('rfqs')">RFQs</a> ${I('chev',13)} <a onclick="openRFQ('${r.id}')">${r.id}</a> ${I('chev',13)} <span>Award</span></div>
    <div class="pagehead"><div><h1>Award — ${r.id}</h1><p>Split lines across vendors, set awarded quantities, then generate the PO(s).</p></div>
      <div class="spacer"></div><button class="btn btn-pri" onclick="confirmAward('${r.id}')">${I('award',15,'#fff')} Award &amp; generate PO</button></div>
    <div class="card" style="margin-bottom:16px"><div class="chead"><h3>Line Allocation</h3><div class="spacer"></div><span class="badge b-teal">Multi-vendor split allowed</span></div>
      <table><thead><tr><th>Line item</th><th>Award to vendor</th><th>Awarded qty</th><th class="amt">Line value</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="card"><div class="chead"><h3>Award Summary</h3></div><div class="cbody">
      ${Object.keys(byV).map(v=>`<div class="file" style="justify-content:space-between"><div style="font-weight:600">${venById(v).name}</div><div style="font-weight:700;color:var(--teal)">RM ${fmt(byV[v])}</div></div>`).join('')}
      <div style="display:flex;justify-content:space-between;padding-top:12px;margin-top:6px;border-top:2px solid #333;font-weight:700;font-size:15px"><span>Total award value</span><span>RM ${fmt(grand)}</span></div>
      <p class="hint" style="margin-bottom:0">${Object.keys(byV).length} purchase order${Object.keys(byV).length!==1?'s':''} will be created and synced to NetSuite — one per awarded vendor.</p>
    </div></div>`;
}
function setAllocVendor(code,v){S._alloc[code].vid=v;const r=rfqById(S.rfqId);renderAward(r,awardableVids(r));}
function setAllocQty(code,q){S._alloc[code].qty=Math.max(0,Number(q)||0);const r=rfqById(S.rfqId);renderAward(r,awardableVids(r));}
function confirmAward(id){
  const r=rfqById(id);const bids=DATA.bids[id];const alloc=S._alloc;
  const byV={};r.lines.forEach(l=>{const a=alloc[l.code];if(!a.vid||!a.qty)return;byV[a.vid]=byV[a.vid]||[];byV[a.vid].push({...l,awardQty:a.qty,price:bids[a.vid].lines[l.code].price});});
  const pos=Object.keys(byV).map(function(v){var pid='PO-2026-'+(1300+(DATA.pos||[]).length);DATA.pos.push({id:pid,vendorId:v,rfqId:r.id,prRefs:(r.prRefs||[]).slice(),date:'28/06/2026',currency:'MYR',incoterm:'DDP Bintulu',status:'Draft',ack:false,nsId:null,lines:byV[v].map(function(l){return {code:l.code,item:l.item,qty:l.awardQty,uom:l.uom,price:l.price,recv:0,inv:0};})});logAudit({who:'buyer',actor:actorName(),action:'Generated PO from award',entity:pid,detail:'from '+r.id});return pid;});
  r.status='awarded';r.po=pos[0];r._awardByV=byV;r._pos=pos;
  openModal(`
    <div class="mhead">${I('check',20,'var(--green)')}<h3>Award Confirmed</h3></div>
    <div class="mbody">
      <div class="locked-note" style="background:var(--green-bg);color:#256b41;margin-bottom:14px">${I('check',16,'#2f7d56')} ${Object.keys(byV).length} purchase order(s) generated and queued to NetSuite.</div>
      ${Object.keys(byV).map((v,i)=>`<div class="file" style="justify-content:space-between">
        <div><div style="font-weight:700">${pos[i]}</div><div class="hint">${venById(v).name} · ${byV[v].length} line(s)</div></div>
        <span class="ns">${I('box',12,'#fff')}Synced</span></div>`).join('')}
    </div>
    <div class="mfoot"><button class="btn btn-pri" onclick="closeModal();goProc('awards')">View awards</button></div>`);
}
function awardedBlock(r){
  const byV=r._awardByV;const pos=r._pos;
  return `<div class="card"><div class="chead"><h3>Award Outcome</h3><div class="spacer"></div><span class="badge b-green">Awarded</span></div>

  const v=b.formAnswers[it.id];const dis=ro?'disabled':'';let ctrl='';
  switch(it.type){
    case 'long_text':ctrl=`<textarea rows="3" ${dis} oninput="vbSet('${it.id}',this.value)" placeholder="Your response">${qesc(v||'')}</textarea>`;break;

    case 'attachment':{const files=(b.files||[]).filter(f=>f.qid===it.id);ctrl=`<div>${files.map((f,fi)=>`<div class="file"><span class="ext">${f.n.split('.').pop().toUpperCase()}</span><span style="flex:1">${f.n}</span>${ro?'':`<span style="cursor:pointer;color:var(--red)" onclick="vbDelQFile('${it.id}',${fi})">Remove</span>`}</div>`).join('')||'<p class="hint" style="margin:0 0 6px">No file uploaded.</p>'}${ro?'':`<button class="btn btn-out btn-sm" onclick="vbQFile('${it.id}','${(it.config.filetypes||'PDF')}')">${I('upload',14)} Upload ${qesc(it.config.filetypes||'PDF')}</button>`}<div class="hint" style="margin-top:4px">Files are uploaded here in the portal.</div></div>`;}break;

    default:ctrl=`<input type="text" value="${qesc(v||'')}" ${dis} oninput="vbSet('${it.id}',this.value)" placeholder="Your response">`;
  }
  return `<div class="vitem" id="vbq_${it.id}"><label class="vlab">${qesc(it.label)||'(question)'} ${req}</label>${ctrl}</div>`;
}

/* ===================== Floating clarification widget ===================== */
function chatState(){S.chat=S.chat||{windows:[],listOpen:false,min:{},seen:{},pending:{}};S.chat.pending=S.chat.pending||{};return S.chat;}
function chatMe(){return S.role==='proc'?'buyer':'vendor';}
function chatKey(rfqId,vid){return rfqId+'|'+vid;}
function chatCss(k){return k.replace(/[^a-zA-Z0-9]/g,'_');}
function chatInitials(n){return (n||'?').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();}
function chatTitle(scope){if(scope==='general')return 'General inquiry';const r=rfqById(scope);if(r)return r.title;const po=poById(scope);if(po)return 'PO '+po.id;return scope;}
function isRfqScope(scope){return !!rfqById(scope);}
function chatThread(scope,vid){DATA.clarifications[scope]=DATA.clarifications[scope]||{};DATA.clarifications[scope][vid]=DATA.clarifications[scope][vid]||[];return DATA.clarifications[scope][vid];}
function chatSeen(scope,vid){return chatState().seen[S.role+'|'+chatKey(scope,vid)]||0;}
function chatMarkSeen(scope,vid){chatState().seen[S.role+'|'+chatKey(scope,vid)]=chatThread(scope,vid).length;}
function chatUnread(scope,vid){const me=chatMe();return chatThread(scope,vid).slice(chatSeen(scope,vid)).filter(m=>m.who!==me).length;}
function chatRelScope(scope){if(scope==='general')return true;const r=rfqById(scope);if(r)return ['open','closed','evaluation'].includes(r.status);if(poById(scope))return true;return false;}
function clarThreads(){
  const out=[];const seen={};
  const mk=(scope,vid)=>{const th=chatThread(scope,vid);const r=scope==='general'?null:rfqById(scope);return {scope,vid,name:S.role==='proc'?vName(vid):'Procurement',title:chatTitle(scope),sub:scope==='general'?'General inquiry':scope,th,unread:chatUnread(scope,vid),open:!!(r&&r.status==='open'),general:scope==='general'};};
  const add=(scope,vid)=>{const k=chatKey(scope,vid);if(seen[k])return;seen[k]=1;out.push(mk(scope,vid));};
  if(S.role==='proc'){
    Object.keys(DATA.clarifications).forEach(scope=>{if(!chatRelScope(scope))return;Object.keys(DATA.clarifications[scope]).forEach(vid=>{const th=DATA.clarifications[scope][vid];if(th&&th.length)add(scope,vid);});});
    DATA.rfqs.forEach(r=>{if(r.status!=='open')return;(r.invited||[]).forEach(vid=>add(r.id,vid));});
  }else{
    const vid=S.vendorId;if(!vid)return out;
    Object.keys(DATA.clarifications).forEach(scope=>{if(!chatRelScope(scope))return;const th=DATA.clarifications[scope]&&DATA.clarifications[scope][vid];if(th&&th.length)add(scope,vid);});
    DATA.rfqs.forEach(r=>{if(r.status!=='open')return;if((r.invited||[]).includes(vid))add(r.id,vid);});
  }
  // always surface the active thread (just-created/open), even if empty / vendor not invited

let dockPos=null,_dockDrag=null;
function chatDockDown(e){
  const dock=document.getElementById('chatDock');if(!dock)return;
  const r=dock.getBoundingClientRect();
  _dockDrag={sx:e.clientX,sy:e.clientY,right:window.innerWidth-r.right,bottom:window.innerHeight-r.bottom,moved:false};
  document.body.style.userSelect='none';
  window.addEventListener('pointermove',chatDockMove);
  window.addEventListener('pointerup',chatDockUp);
  window.addEventListener('pointercancel',chatDockUp);
  if(e.preventDefault)e.preventDefault();
}
function chatDockMove(e){
  if(!_dockDrag)return;
  const dx=e.clientX-_dockDrag.sx,dy=e.clientY-_dockDrag.sy;
  if(!_dockDrag.moved&&Math.abs(dx)+Math.abs(dy)<5)return;
  _dockDrag.moved=true;
  const dock=document.getElementById('chatDock');if(!dock)return;
  const w=dock.offsetWidth,h=dock.offsetHeight;
  let nr=_dockDrag.right-dx,nb=_dockDrag.bottom-dy;
  nr=Math.max(6,Math.min(nr,window.innerWidth-w-6));
  nb=Math.max(6,Math.min(nb,window.innerHeight-h-6));
  dock.style.left='auto';dock.style.top='auto';
  dock.style.right=nr+'px';dock.style.bottom=nb+'px';
  dockPos={right:nr,bottom:nb};
}
function chatDockUp(){
  window.removeEventListener('pointermove',chatDockMove);
  window.removeEventListener('pointerup',chatDockUp);
  window.removeEventListener('pointercancel',chatDockUp);

  const moved=_dockDrag&&_dockDrag.moved;_dockDrag=null;

}

  var shown=all.filter(flt);
  var exc=all.filter(function(p){return p.status==='Discrepancy';}).length;
  var openVal=all.filter(function(p){return !['Draft','Closed'].includes(p.status);}).reduce(function(a,p){return a+poValue(p);},0);
  var awaiting=all.filter(function(p){return ['Issued','Acknowledged','Partially received'].includes(p.status);}).length;

    <td style="min-width:130px"><div class="pbar"><i style="width:${rec}%"></i></div><div class="hint" style="margin-top:3px">${poRecvQty(po)}/${tot} received</div></td>
    <td><span class="badge ${poBadge(po.status)}">${po.status}</span></td>
    <td class="amt"><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openPO('${po.id}')">Open ${I('chev',13)}</button></td></tr>`;}).join('')||`<tr><td colspan="7"><div class="empty"><div class="ic">${I('box',30)}</div>No POs in this view.</div></td></tr>`;
  $('main').innerHTML=`
    <div class="pagehead"><div><h1>Purchase Orders</h1><p>PO lifecycle and 3-way matching — purchase order vs goods receipt vs supplier invoice.</p></div></div>
    <div class="ribbon"><span class="ns">${I('box',12,'#fff')}NetSuite</span> POs are created from awards and synced to NetSuite Purchasing.${exc?` <strong>${exc} invoice discrepancy(ies)</strong> pending exception review.`:''}</div>
    <div class="grid g4" style="margin-bottom:16px">
      <div class="card stat"><div class="lbl">Total POs</div><div class="num">${all.length}</div><div class="sub">all statuses</div></div>

}
function openPO(id){S.poId=id;S.procScreen='po';render();}

/* ---- 3-way match readout (shared) ---- */
function poMatchRow(label,val,state){var b=state==null?'<span class="badge b-grey">pending</span>':state?'<span class="badge b-green">match</span>':'<span class="badge b-red">variance</span>';return `<div class="mrow"><span>${label}</span><span style="display:flex;align-items:center;gap:8px"><span style="font-weight:600">${val}</span>${b}</span></div>`;}
function poMatchCard(po){var val=poValue(po);var rq=poRecvQty(po),tq=poTotQty(po),iq=poInvQty(po);var invAmt=poInvAmt(po);var hasInv=iq>0;var variance=hasInv?invAmt-val:0;
  return `<div class="card" style="margin-bottom:16px"><div class="chead"><h3>3-way match</h3><div class="spacer"></div><span class="hint">PO vs goods receipt vs invoice</span></div>
    <div class="grid g3" style="padding:14px 16px 4px">
      <div class="card stat"><div class="lbl">Purchase order</div><div class="num" style="font-size:18px">RM ${fmt(val)}</div><div class="sub">${tq} ${po.lines.length>1?'items':po.lines[0].uom}</div></div>
      <div class="card stat"><div class="lbl">Goods receipt</div><div class="num" style="font-size:18px">${rq}/${tq}</div><div class="sub">${rq>=tq?'fully received':rq>0?'partial':'awaiting'}</div></div>
      <div class="card stat"><div class="lbl">Supplier invoice</div><div class="num" style="font-size:18px">${hasInv?'RM '+fmt(invAmt):'—'}</div><div class="sub">${hasInv?'received':'not received'}</div></div>
    </div>
    <div class="cbody">
      ${poMatchRow('Quantity · PO vs goods receipt',tq+' vs '+rq,rq===tq)}
      ${poMatchRow('Quantity · goods receipt vs invoice',hasInv?rq+' vs '+iq:'—',hasInv?rq===iq:null)}
      ${poMatchRow('Value · PO vs invoice',hasInv?'RM '+fmt(val)+' vs RM '+fmt(invAmt):'—',hasInv?variance===0:null)}
      ${(hasInv&&variance!==0)?`<div style="background:#fbeded;color:#9c3a30;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:12.5px">${I('flag',15,'var(--red)')} Invoice variance RM ${fmt(Math.abs(variance))} (${variance>0?'over-billed':'under-billed'}) — blocked from payment, routed for exception approval.</div>`:''}
    </div></div>`;
}
function poTimeline(po){var items=auditFor(po.id);if(!items.length)return '';return `<div class="card"><div class="chead"><h3>Activity</h3><div class="spacer"></div><span class="hint">audit trail</span></div><div class="cbody">${items.slice().reverse().map(function(a){return `<div class="file" style="justify-content:flex-start;gap:10px"><span class="cav" style="width:26px;height:26px;font-size:10px">${chatInitials(a.actor||a.who)}</span><div><div style="font-weight:600;font-size:12.5px">${a.action}</div><div class="hint">${a.actor||a.who} · ${a.t}${a.detail?' · '+a.detail:''}</div></div></div>`;}).join('')}</div></div>`;}

/* ---- procurement: PO detail ---- */
function procPODetail(id){var po=poById(id);if(!po){S.procScreen='pos';return procPOs();}

  $('main').innerHTML=`

    <div class="card" style="margin-bottom:16px"><div class="chead"><h3>PO Lines</h3><div class="spacer"></div><span class="hint">Total RM ${fmt(val)}</span></div>
      <table><thead><tr><th>Code</th><th>Item</th><th class="amt">Qty</th><th>UoM</th><th class="amt">Unit price</th><th class="amt">Line total</th><th class="amt">Recv</th><th class="amt">Inv</th></tr></thead><tbody>${lrows}</tbody></table></div>

/* ---- PO actions (gates + audit) ---- */
function poIssueConfirm(id){var po=poById(id);if(!po)return;openModal(`<div class="mhead">${I('send',20,'var(--teal)')}<h3>Issue ${po.id}?</h3></div><div class="mbody"><p>This pushes the PO to NetSuite Purchasing and notifies <strong>${venById(po.vendorId).name.replace(/&amp;/g,'&')}</strong>. The vendor will be asked to acknowledge.</p></div><div class="mfoot"><button class="btn btn-out" onclick="closeModal()">Not yet</button><button class="btn btn-pri" onclick="closeModal();poIssue('${id}')">${I('send',15,'#fff')} Issue now</button></div>`);}
function poIssue(id){var po=poById(id);if(!po)return;po.status='Issued';if(!po.nsId)po.nsId='NS-PO-'+(45000+Math.floor(Math.random()*900));logAudit({who:'buyer',actor:actorName(),action:'Issued PO',entity:id,detail:'pushed to NetSuite '+po.nsId});toast('PO issued · '+po.id);render();}
function poAck(id){var po=poById(id);if(!po)return;po.ack=true;if(po.status==='Issued')po.status='Acknowledged';logAudit({who:'vendor',actor:actorName(),action:'Acknowledged PO',entity:id});toast('PO acknowledged');render();}
function poReceive(id){var po=poById(id);if(!po)return;po.lines.forEach(function(l){l.recv=l.qty;});po.status='Received';logAudit({who:'buyer',actor:actorName(),action:'Recorded goods receipt',entity:id,detail:'all lines received'});toast('Goods receipt recorded · '+po.id);render();}
function poException(id){var po=poById(id);if(!po)return;po.status='On hold';logAudit({who:'buyer',actor:actorName(),action:'Routed invoice exception for approval',entity:id,detail:'variance RM '+fmt(Math.abs(poInvAmt(po)-poValue(po)))});toast('Exception routed for approval');render();}
function poPay(id){var po=poById(id);if(!po)return;po.status='Closed';logAudit({who:'buyer',actor:actorName(),action:'Released for payment',entity:id});toast('Matched — released for payment');render();}

 {id:'ASN-2026-0508',poId:'PO-2026-1185',vendorId:'sentausa',carrier:'Pos Logistics',trackingNo:'PL-77310',shippedDate:'12/06/2026',expectedDate:'14/06/2026',status:'Received',grnId:'GRN-2026-0301',
   lines:[{code:'MEP-PUMP-075',item:'Centrifugal Pump, 75 kW, end-suction',shippedQty:4,uom:'Unit',lotNo:'LOT-PMP-0612'},
          {code:'ELE-VFD-075',item:'VFD Drive, 75 kW, IP55',shippedQty:4,uom:'Unit',lotNo:'LOT-VFD-0612'}]},
 {id:'ASN-2026-0511',poId:'PO-2026-1186',vendorId:'pantai',carrier:'Tiong Nam Logistics',trackingNo:'TN-88421',shippedDate:'26/06/2026',expectedDate:'29/06/2026',status:'In transit',grnId:null,
   lines:[{code:'VLV-GAT-150',item:'Gate Valve, DN150, PN16, CS',shippedQty:8,uom:'Unit',lotNo:'LOT-VG-0626'}]},
];
DATA.grns = DATA.grns || [
 {id:'GRN-2026-0301',asnId:'ASN-2026-0508',poId:'PO-2026-1185',receivedDate:'14/06/2026',receivedBy:'Procurement',status:'Posted',nsId:'NS-IR-30121',
   lines:[{code:'MEP-PUMP-075',item:'Centrifugal Pump, 75 kW, end-suction',expectedQty:4,receivedQty:4,condition:'Good'},
          {code:'ELE-VFD-075',item:'VFD Drive, 75 kW, IP55',expectedQty:4,receivedQty:4,condition:'Good'}]},
];
function asnById(id){return (DATA.asns||[]).find(function(a){return a.id===id;});}
function grnById(id){return (DATA.grns||[]).find(function(g){return g.id===id;});}
function grnForAsn(id){return (DATA.grns||[]).find(function(g){return g.asnId===id;});}
function asnsForPO(poId){return (DATA.asns||[]).filter(function(a){return a.poId===poId;});}
function asnsForVendor(vid){return (DATA.asns||[]).filter(function(a){return a.vendorId===vid;});}
function asnBadge(s){return ({Draft:'b-grey','In transit':'b-blue',Received:'b-green',Closed:'b-grey'})[s]||'b-grey';}
function asnSeq(){return 'ASN-2026-0'+(520+(DATA.asns||[]).length);}
function grnSeq(){return 'GRN-2026-0'+(310+(DATA.grns||[]).length);}
function poLineByCode(po,code){return po.lines.find(function(l){return l.code===code;});}
function poRemaining(po,code){var l=poLineByCode(po,code);return l?l.qty-(l.recv||0):0;}
function poLineInTransit(po,code){return (DATA.asns||[]).filter(function(a){return a.poId===po.id&&a.status==='In transit';}).reduce(function(s,a){var ln=a.lines.find(function(x){return x.code===code;});return s+(ln?ln.shippedQty:0);},0);}
function poRemainingToShip(po,code){var l=poLineByCode(po,code);if(!l)return 0;return Math.max(0,l.qty-poLineInTransit(po,code)-(l.recv||0));}
function poTotRemainToShip(po){return po.lines.reduce(function(s,l){return s+poRemainingToShip(po,l.code);},0);}

/* ---- shared deliveries card on PO detail ---- */
function poDeliveriesCard(po,role){var list=asnsForPO(po.id);

    else act=`<button class="btn btn-ghost btn-sm" onclick="openVASN('${a.id}')">View ${I('chev',13)}</button>`;
    return `<tr><td style="font-weight:600;color:var(--teal)">${a.id}</td><td>${a.carrier}</td><td>${a.expectedDate}</td><td><span class="badge ${asnBadge(a.status)}">${a.status}</span></td><td class="amt">${act||''}</td></tr>`;}).join('');
  return `<div class="card" style="margin-bottom:16px"><div class="chead"><h3>Deliveries</h3><div class="spacer"></div><span class="hint">advance shipping notices &amp; goods receipts</span></div>
    ${list.length?`<table><thead><tr><th>ASN</th><th>Carrier</th><th>Expected</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="cbody"><p class="hint" style="margin:0">${role==='proc'?'No shipments yet — awaiting an advance shipping notice (ASN) from the supplier.':'No shipping notices yet. Create one to notify the buyer of an inbound delivery.'}</p></div>`}</div>`;
}

/* ====================== BUYER: inbound deliveries ====================== */

  var shown=all.filter(flt);
  var inT=all.filter(function(a){return a.status==='In transit';}).length;
  var rec=all.filter(function(a){return a.status==='Received';}).length;
  var tab=function(k,l){return `<button class="btn btn-sm ${f===k?'btn-pri':'btn-out'}" onclick="S.dlF='${k}';render()">${l}</button>`;};
  var rows=shown.map(function(a){var act=a.status==='In transit'?`<button class="btn btn-pri btn-sm" onclick="event.stopPropagation();openReceive('${a.id}')">${I('box',13,'#fff')} Receive</button>`:`<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openReceive('${a.id}')">View GRN ${I('chev',13)}</button>`;
    return `<tr class="rowlink" onclick="openReceive('${a.id}')"><td style="font-weight:700;color:var(--teal)">${a.id}</td><td>${a.poId}</td><td>${venById(a.vendorId).name.replace(/&amp;/g,'&')}</td><td>${a.carrier}</td><td>${a.expectedDate}</td><td><span class="badge ${asnBadge(a.status)}">${a.status}</span></td><td class="amt">${act}</td></tr>`;}).join('')||`<tr><td colspan="7"><div class="empty"><div class="ic">${I('send',30)}</div>No deliveries in this view.</div></td></tr>`;
  $('main').innerHTML=`
    <div class="pagehead"><div><h1>Inbound Deliveries</h1><p>Advance shipping notices from suppliers. Receive against an ASN to raise the goods receipt (GRN).</p></div></div>
    <div class="ribbon"><span class="ns">${I('box',12,'#fff')}NetSuite</span> Posting a goods receipt creates an Item Receipt in NetSuite and feeds the 3-way match.</div>
    <div class="grid g3" style="margin-bottom:16px">
      <div class="card stat"><div class="lbl">In transit</div><div class="num">${inT}</div><div class="sub">awaiting receipt</div></div>
      <div class="card stat"><div class="lbl">Received</div><div class="num">${rec}</div><div class="sub">GRN posted</div></div>
      <div class="card stat"><div class="lbl">Total ASNs</div><div class="num">${all.length}</div><div class="sub">all shipments</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px">${tab('all','All')}${tab('transit','In transit')}${tab('received','Received')}</div>
    <div class="card"><table><thead><tr><th>ASN</th><th>PO</th><th>Vendor</th><th>Carrier</th><th>Expected</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function openReceive(id){S.asnId=id;S.grnDraft=null;S.procScreen='receive';render();}

/* ---- buyer: receive (GRN form / read-only) ---- */
function grnSetQty(code,v){S.grnDraft.qty[code]=v;}
function grnSetCond(code,v){S.grnDraft.cond[code]=v;}
function procReceive(){var asn=asnById(S.asnId);if(!asn){S.procScreen='deliveries';return procDeliveries();}
  var po=poById(asn.poId);var ro=asn.status!=='In transit';var grn=ro?grnForAsn(asn.id):null;
  if(!ro){if(!S.grnDraft||S.grnDraft.asnId!==asn.id){S.grnDraft={asnId:asn.id,qty:{},cond:{}};asn.lines.forEach(function(l){S.grnDraft.qty[l.code]=l.shippedQty;S.grnDraft.cond[l.code]='Good';});}}
  var A=[`<button class="btn btn-out" onclick="goProc('deliveries')">${I('back',15)} Back</button>`];
  if(!ro)A.push(`<button class="btn btn-pri" onclick="grnPostConfirm('${asn.id}')">${I('box',15,'#fff')} Post goods receipt</button>`);
  var actions=`<div class="actbar">${A.join('')}</div>`;
  var lrows=asn.lines.map(function(l){var gl=ro&&grn?grn.lines.find(function(x){return x.code===l.code;}):null;
    var recv=ro?(gl?gl.receivedQty:0):(S.grnDraft.qty[l.code]);
    var cond=ro?(gl?gl.condition:'—'):(S.grnDraft.cond[l.code]);
    var rcell=ro?String(recv):`<input type="number" min="0" max="${l.shippedQty}" value="${recv}" style="width:90px;text-align:right" oninput="grnSetQty('${l.code}',this.value)">`;
    var ccell=ro?cond:`<select onchange="grnSetCond('${l.code}',this.value)"><option ${cond==='Good'?'selected':''}>Good</option><option ${cond==='Damaged'?'selected':''}>Damaged</option><option ${cond==='Short'?'selected':''}>Short</option></select>`;
    return `<tr><td>${l.code}</td><td>${l.item}</td><td class="amt">${l.shippedQty} ${l.uom}</td><td class="amt">${rcell}</td><td>${ccell}</td></tr>`;}).join('');
  $('main').innerHTML=`
    <div class="crumb"><a onclick="goProc('deliveries')">Inbound Deliveries</a> ${I('chev',13)} <span>${asn.id}</span></div>
    <div class="pagehead"><div><h1>${ro?'Goods receipt · '+(grn?grn.id:asn.id):'Receive '+asn.id}</h1><p>${venById(asn.vendorId).name.replace(/&amp;/g,'&')} · ${asn.poId} · carrier ${asn.carrier} · expected ${asn.expectedDate}</p></div><div class="spacer"></div>${actions}</div>
    <div class="ribbon"><span class="badge ${asnBadge(asn.status)}">${asn.status}</span>${ro&&grn?` <span class="badge b-green" style="margin-left:6px">${I('check',11)} GRN posted${grn.nsId?' · '+grn.nsId:''}</span>`:` <span class="hint" style="margin-left:8px">Verify quantities and condition, then post. The goods receipt updates the PO and the 3-way match.</span>`}</div>
    <div class="card"><div class="chead"><h3>${ro?'Received lines':'Receiving against '+asn.id}</h3><div class="spacer"></div><span class="hint">GRN ${ro&&grn?grn.id:grnSeq()} · ${ro&&grn?grn.receivedDate:'28/06/2026'}</span></div>
      <table><thead><tr><th>Code</th><th>Item</th><th class="amt">Shipped</th><th class="amt">Received</th><th>Condition</th></tr></thead><tbody>${lrows}</tbody></table></div>
    <div class="actbar actbar-foot" style="margin-top:16px">${A.join('')}</div>`;
}
function grnPostConfirm(id){var asn=asnById(id);if(!asn)return;openModal(`<div class="mhead">${I('box',20,'var(--teal)')}<h3>Post goods receipt for ${asn.id}?</h3></div><div class="mbody"><p>This records the received quantities, creates an Item Receipt in NetSuite, and updates <strong>${asn.poId}</strong> and its 3-way match.</p></div><div class="mfoot"><button class="btn btn-out" onclick="closeModal()">Not yet</button><button class="btn btn-pri" onclick="closeModal();grnPost('${id}')">${I('box',15,'#fff')} Post receipt</button></div>`);}
function grnPost(id){var asn=asnById(id);if(!asn)return;var po=poById(asn.poId);var d=S.grnDraft;
  var glines=asn.lines.map(function(l){var pl=poLineByCode(po,l.code);var outstanding=pl?Math.max(0,pl.qty-(pl.recv||0)):0;var rq=parseInt((d&&d.qty[l.code])||0,10)||0;if(rq<0)rq=0;if(rq>l.shippedQty)rq=l.shippedQty;if(rq>outstanding)rq=outstanding;var cond=(d&&d.cond[l.code])||'Good';if(rq<l.shippedQty&&cond==='Good')cond='Short';return {code:l.code,item:l.item,expectedQty:l.shippedQty,receivedQty:rq,condition:cond};});
  glines.forEach(function(gl){var pl=poLineByCode(po,gl.code);if(pl)pl.recv=Math.min(pl.qty,(pl.recv||0)+gl.receivedQty);});var _short=glines.some(function(g){return g.receivedQty<g.expectedQty;});
  var grn={id:grnSeq(),asnId:asn.id,poId:po.id,receivedDate:'28/06/2026',receivedBy:actorName(),status:'Posted',nsId:'NS-IR-'+(30200+DATA.grns.length),lines:glines};
  DATA.grns.push(grn);asn.status='Received';asn.grnId=grn.id;
  if(['Issued','Acknowledged','Partially received'].includes(po.status))po.status=(poRecvQty(po)>=poTotQty(po))?'Received':'Partially received';
  logAudit({who:'buyer',actor:actorName(),action:'Posted goods receipt',entity:po.id,detail:grn.id+' against '+asn.id});
  logAudit({who:'buyer',actor:actorName(),action:'Posted goods receipt',entity:asn.id,detail:grn.id});
  toast('Goods receipt posted · '+grn.id);S.grnDraft=null;S.procScreen='deliveries';render();
}

    <div class="card" style="margin-bottom:16px"><div class="chead"><h3>Shipment details</h3></div><div class="cbody">
      <div class="grid g2">
        <div class="field"><label>Carrier</label><input type="text" value="${d.carrier}" placeholder="e.g. Tiong Nam Logistics" oninput="asnSetHdr('carrier',this.value)"></div>

        <div class="field"><label>Shipped date</label><input type="text" value="${d.shippedDate}" oninput="asnSetHdr('shippedDate',this.value)"></div>
        <div class="field" style="margin-bottom:0"><label>Expected delivery date</label><input type="text" value="${d.expectedDate}" placeholder="dd/mm/yyyy" oninput="asnSetHdr('expectedDate',this.value)"></div>
      </div></div></div>
    <div class="card" style="margin-bottom:16px"><div class="chead"><h3>Shipment lines</h3><div class="spacer"></div><span class="hint">enter the quantity in this shipment</span></div>
      <table><thead><tr><th>Code</th><th>Item</th><th class="amt">Ordered</th><th class="amt">Already recv</th><th class="amt">Remaining</th><th class="amt">This shipment</th><th>Lot / batch</th></tr></thead><tbody>${lrows}</tbody></table></div>
    <div class="card"><div class="chead"><h3>Delivery documents</h3><div class="spacer"></div><button class="btn btn-out btn-sm" onclick="toast('Attach delivery order / packing list (demo)')">${I('upload',14)} Attach DO / packing list</button></div><div class="cbody"><p class="hint" style="margin:0">Attach the delivery order and packing list (PDF) for the buyer's receiving team.</p></div></div>
    <div class="actbar actbar-foot">${A.join('')}</div>`;
}
function asnBuild(status){var po=poById(S.asnDraft.poId);var d=S.asnDraft;
  var lines=po.lines.map(function(l){return {code:l.code,item:l.item,shippedQty:Math.max(0,Math.min(parseInt(d.qty[l.code]||0,10)||0,poRemainingToShip(po,l.code))),uom:l.uom,lotNo:d.lot[l.code]||''};}).filter(function(x){return x.shippedQty>0;});
  return {id:asnSeq(),poId:po.id,vendorId:S.vendorId,carrier:d.carrier,trackingNo:d.trackingNo,shippedDate:d.shippedDate,expectedDate:d.expectedDate,status:status,grnId:null,lines:lines};
}

/* ============================================================
 * PROCURE-TO-PAY · PHASE 3 — Invoice + line-level 3-way match
 * Supplier submits invoice -> auto-match vs PO + GRN -> approve / exception.
 * (Self-billing/ERS and DOA approval matrix deferred — see plan.)
 * ============================================================*/
var INV_PRICE_TOL = 0.02; // 2% price tolerance
DATA.invoices = DATA.invoices || [
 {id:'INV-2026-0091',poId:'PO-2026-1185',vendorId:'sentausa',grnIds:['GRN-2026-0301'],invoiceNo:'STU-INV-3391',date:'14/06/2026',currency:'MYR',whtRate:0,status:'Approved',nsId:'NS-VB-50121',
   lines:[{code:'MEP-PUMP-075',item:'Centrifugal Pump, 75 kW, end-suction',qty:4,uom:'Unit',price:48500},
          {code:'ELE-VFD-075',item:'VFD Drive, 75 kW, IP55',qty:4,uom:'Unit',price:18200}]},
 {id:'INV-2026-0094',poId:'PO-2026-1193',vendorId:'megatech',grnIds:[],invoiceNo:'MEG-INV-7720',date:'24/06/2026',currency:'MYR',whtRate:0,status:'Exception',exceptionReason:'Unit price billed above PO (RM 23,200 vs RM 22,500).',
   lines:[{code:'ELE-MTR-200',item:'Motor, 200 kW, TEFC',qty:6,uom:'Unit',price:23200}]},
];
function invById(id){return (DATA.invoices||[]).find(function(i){return i.id===id;});}
function invForPO(poId){return (DATA.invoices||[]).filter(function(i){return i.poId===poId;});}
function invForVendor(vid){return (DATA.invoices||[]).filter(function(i){return i.vendorId===vid;});}
function invSubtotal(i){return i.lines.reduce(function(a,l){return a+l.qty*l.price;},0);}
function invSST(i){return Math.round(invSubtotal(i)*0.08);}
function invWHT(i){return Math.round(invSubtotal(i)*((i.whtRate||0)/100));}
function invTotal(i){return invSubtotal(i)+invSST(i)-invWHT(i);}
function invBadge(s){return ({Draft:'b-grey',Submitted:'b-blue',Approved:'b-green',Exception:'b-red',Paid:'b-grey'})[s]||'b-grey';}
function matchBadge(ms){return ms==='Matched'?'b-green':ms==='Variance'?'b-red':'b-grey';}
function poLineInv(po,code){return invForPO(po.id).reduce(function(a,i){return a+i.lines.filter(function(l){return l.code===code;}).reduce(function(b,l){return b+l.qty;},0);},0);}
function invLineMatch(line,po){var pl=poLineByCode(po,line.code);if(!pl)return {qtyOk:false,priceOk:false,ok:false};var qtyOk=line.qty<=(pl.recv||0);var priceOk=Math.abs(line.price-pl.price)<=pl.price*INV_PRICE_TOL;return {qtyOk:qtyOk,priceOk:priceOk,ok:qtyOk&&priceOk};}
function invMatchStatus(inv){var po=poById(inv.poId);if(!po)return 'Variance';return inv.lines.every(function(l){return invLineMatch(l,po).ok;})?'Matched':'Variance';}

/* ====================== BUYER: AP / invoices ====================== */
function procInvoices(){
  if(!S.invF)S.invF='all';var f=S.invF;
  var all=(DATA.invoices||[]).slice();
  var ms=function(i){return invMatchStatus(i);};
  var flt=function(i){if(f==='all')return true;if(f==='awaiting')return i.status==='Submitted';if(f==='exceptions')return i.status==='Exception'||ms(i)==='Variance';if(f==='approved')return i.status==='Approved'||i.status==='Paid';return true;};
  var shown=all.filter(flt);
  var awaiting=all.filter(function(i){return i.status==='Submitted';}).length;
  var exc=all.filter(function(i){return i.status==='Exception';}).length;
  var appr=all.filter(function(i){return i.status==='Approved';}).length;
  var apTotal=all.filter(function(i){return i.status==='Approved';}).reduce(function(a,i){return a+invTotal(i);},0);
  var tab=function(k,l){return `<button class="btn btn-sm ${f===k?'btn-pri':'btn-out'}" onclick="S.invF='${k}';render()">${l}</button>`;};
  var rows=shown.map(function(i){var m=ms(i);return `<tr class="rowlink" onclick="openInvoice('${i.id}')">
    <td style="font-weight:700;color:var(--teal)">${i.id}</td><td>${i.invoiceNo}</td><td>${venById(i.vendorId).name.replace(/&amp;/g,'&')}</td><td>${i.poId}</td>
    <td class="amt">RM ${fmt(invTotal(i))}</td><td><span class="badge ${matchBadge(m)}">${m}</span></td><td><span class="badge ${invBadge(i.status)}">${i.status}</span></td>
    <td class="amt"><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openInvoice('${i.id}')">Open ${I('chev',13)}</button></td></tr>`;}).join('')||`<tr><td colspan="8"><div class="empty"><div class="ic">${I('doc',30)}</div>No invoices in this view.</div></td></tr>`;
  $('main').innerHTML=`
    <div class="pagehead"><div><h1>Invoices (AP)</h1><p>Supplier invoices, auto-matched against the PO and goods receipt. Approve matched invoices; route variances for exception approval.</p></div></div>
    <div class="ribbon"><span class="ns">${I('box',12,'#fff')}NetSuite</span> Approved invoices post as Vendor Bills in NetSuite.${exc?` <strong>${exc} exception(s)</strong> awaiting resolution.`:''}</div>
    <div class="grid g4" style="margin-bottom:16px">
      <div class="card stat"><div class="lbl">Awaiting match/approval</div><div class="num">${awaiting}</div><div class="sub">submitted</div></div>
      <div class="card stat"><div class="lbl">Exceptions</div><div class="num" style="color:${exc?'var(--red)':'inherit'}">${exc}</div><div class="sub">variance</div></div>
      <div class="card stat"><div class="lbl">Approved</div><div class="num">${appr}</div><div class="sub">for payment</div></div>
      <div class="card stat"><div class="lbl">Approved value</div><div class="num" style="font-size:20px">RM ${fmt(apTotal)}</div><div class="sub">incl. SST</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">${tab('all','All')}${tab('awaiting','Awaiting')}${tab('exceptions','Exceptions')}${tab('approved','Approved')}</div>
    <div class="card"><table><thead><tr><th>Invoice</th><th>Supplier ref</th><th>Vendor</th><th>PO</th><th class="amt">Total</th><th>Match</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function openInvoice(id){S.invId=id;S.procScreen='invoice';render();}

function invMatchLinesTable(inv,po,showMatch){
  return inv.lines.map(function(l){var pl=poLineByCode(po,l.code);var m=invLineMatch(l,po);
    var mcell=showMatch?`<td>${m.ok?'<span class="badge b-green">match</span>':`<span class="badge b-red">${!m.qtyOk?'qty':'price'}</span>`}</td>`:'';
    return `<tr><td>${l.code}</td><td>${l.item}</td><td class="amt">${l.qty}</td><td class="amt">${pl?(pl.recv||0):'—'}</td><td class="amt">RM ${fmt(l.price)}</td><td class="amt">${pl?'RM '+fmt(pl.price):'—'}</td><td class="amt">RM ${fmt(l.qty*l.price)}</td>${mcell}</tr>`;}).join('');
}
function procInvoiceDetail(){var inv=invById(S.invId);if(!inv){S.procScreen='invoices';return procInvoices();}
  var po=poById(inv.poId);var m=invMatchStatus(inv);

function invBuild(status){var po=poById(S.invDraft.poId);var d=S.invDraft;
  var lines=po.lines.map(function(l){var billable=Math.max(0,(l.recv||0)-poLineInv(po,l.code));var q=parseInt(d.qty[l.code]||0,10)||0;if(q>billable)q=billable;return {code:l.code,item:l.item,qty:q,uom:l.uom,price:parseFloat(d.price[l.code]||0)||0};}).filter(function(x){return x.qty>0;});
  return {id:'INV-2026-0'+(100+DATA.invoices.length),poId:po.id,vendorId:S.vendorId,grnIds:asnsForPO(po.id).filter(function(a){return a.grnId;}).map(function(a){return a.grnId;}),invoiceNo:d.invoiceNo||('INV-'+po.id),date:d.date,currency:'MYR',whtRate:parseFloat(d.whtRate||0)||0,status:status,lines:lines};
}

/* ============================================================
 * PROCURE-TO-PAY · PHASE 4 — Payment Voucher (buyer -> supplier)
 * Approved invoices -> remittance with deductions -> approve & release -> Paid.
 * (Deduction set defaults to retention/LD/contra — see plan; DOA matrix deferred.)
 * ============================================================*/
DATA.vouchers = DATA.vouchers || [
 {id:'PV-2026-0031',vendorId:'sentausa',invoiceIds:['INV-2026-0091'],retentionPct:5,ld:0,contra:0,method:'Bank transfer (DuitNow)',paymentDate:'20/06/2026',status:'Paid',nsId:'NS-BP-60011',ackBy:'Lim (Sentausa Engineering)'},
];
(function(){var i=invById&&invById('INV-2026-0091');if(i)i.status='Paid';})();
function vchById(id){return (DATA.vouchers||[]).find(function(v){return v.id===id;});}
function vchForVendor(vid){return (DATA.vouchers||[]).filter(function(v){return v.vendorId===vid;});}
function vchBadge(s){return ({Draft:'b-grey','Pending approval':'b-amber',Approved:'b-blue',Paid:'b-green'})[s]||'b-grey';}
function invApprovedUnpaid(vid){return invForVendor(vid).filter(function(i){return i.status==='Approved';});}
function vchGross(v){return (v.invoiceIds||[]).reduce(function(a,id){var i=invById(id);return a+(i?invTotal(i):0);},0);}
function vchRetention(v){return Math.round(vchGross(v)*((parseFloat(v.retentionPct)||0)/100));}
function vchDeductTotal(v){return vchRetention(v)+(parseFloat(v.ld)||0)+(parseFloat(v.contra)||0);}
function vchNet(v){return vchGross(v)-vchDeductTotal(v);}

/* ====================== BUYER: payment vouchers ====================== */
function procVouchers(){
  if(!S.vchF)S.vchF='all';var f=S.vchF;
  var all=(DATA.vouchers||[]).slice();
  var flt=function(v){if(f==='all')return true;if(f==='pending')return v.status==='Pending approval';if(f==='paid')return v.status==='Paid';if(f==='draft')return v.status==='Draft';return true;};
  var shown=all.filter(flt);
  var pend=all.filter(function(v){return v.status==='Pending approval';}).length;
  var paid=all.filter(function(v){return v.status==='Paid';}).length;
  var paidVal=all.filter(function(v){return v.status==='Paid';}).reduce(function(a,v){return a+vchNet(v);},0);
  var tab=function(k,l){return `<button class="btn btn-sm ${f===k?'btn-pri':'btn-out'}" onclick="S.vchF='${k}';render()">${l}</button>`;};
  var rows=shown.map(function(v){return `<tr class="rowlink" onclick="openVoucher('${v.id}')">
    <td style="font-weight:700;color:var(--teal)">${v.id}</td><td>${venById(v.vendorId).name.replace(/&amp;/g,'&')}</td><td class="amt">${(v.invoiceIds||[]).length}</td>
    <td class="amt">RM ${fmt(vchGross(v))}</td><td class="amt">RM ${fmt(vchNet(v))}</td><td><span class="badge ${vchBadge(v.status)}">${v.status}</span></td>
    <td class="amt"><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openVoucher('${v.id}')">Open ${I('chev',13)}</button></td></tr>`;}).join('')||`<tr><td colspan="7"><div class="empty"><div class="ic">${I('download',30)}</div>No payment vouchers in this view.</div></td></tr>`;
  $('main').innerHTML=`
    <div class="pagehead"><div><h1>Payment Vouchers</h1><p>Remittances to suppliers against approved invoices, net of retention and deductions.</p></div><div class="spacer"></div><button class="btn btn-pri" onclick="openVoucherNew()">${I('plus',15,'#fff')} New payment voucher</button></div>
    <div class="ribbon"><span class="ns">${I('box',12,'#fff')}NetSuite</span> Released vouchers post as Bill Payments in NetSuite.${pend?` <strong>${pend} voucher(s)</strong> pending approval.`:''}</div>
    <div class="grid g3" style="margin-bottom:16px">
      <div class="card stat"><div class="lbl">Pending approval</div><div class="num">${pend}</div><div class="sub">awaiting release</div></div>
      <div class="card stat"><div class="lbl">Paid</div><div class="num">${paid}</div><div class="sub">released</div></div>
      <div class="card stat"><div class="lbl">Paid value (net)</div><div class="num" style="font-size:20px">RM ${fmt(paidVal)}</div><div class="sub">after deductions</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">${tab('all','All')}${tab('pending','Pending')}${tab('paid','Paid')}${tab('draft','Drafts')}</div>
    <div class="card"><table><thead><tr><th>Voucher</th><th>Vendor</th><th class="amt">Invoices</th><th class="amt">Gross</th><th class="amt">Net payable</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function openVoucher(id){S.vchId=id;S.procScreen='voucher';render();}
function openVoucherNew(){S.vchDraft=null;S.procScreen='voucnew';render();}

function vchDeductRows(v){var rows='';var ret=vchRetention(v);
  if(ret)rows+=`<div class="mrow"><span>Retention (${v.retentionPct}%)</span><span style="font-weight:600">− RM ${fmt(ret)}</span></div>`;
  if(parseFloat(v.ld)>0)rows+=`<div class="mrow"><span>Liquidated damages</span><span style="font-weight:600">− RM ${fmt(parseFloat(v.ld))}</span></div>`;
  if(parseFloat(v.contra)>0)rows+=`<div class="mrow"><span>Contra / credit note</span><span style="font-weight:600">− RM ${fmt(parseFloat(v.contra))}</span></div>`;
  return rows;
}
function procVoucherDetail(){var v=vchById(S.vchId);if(!v){S.procScreen='payments';return procVouchers();}
  var A=[`<button class="btn btn-out" onclick="goProc('payments')">${I('back',15)} Back</button>`,`<button class="btn btn-out" onclick="chatOpen('general','${v.vendorId}')">${I('msg',15)} Message vendor</button>`];
  if(v.status==='Draft')A.push(`<button class="btn btn-pri" onclick="vchSubmitConfirm('${v.id}')">${I('send',15,'#fff')} Submit for approval</button>`);

/* ============================================================
 * PROCURE-TO-PAY · PHASE 5 — Statement of Account (per-vendor ledger)
 * Derived from PO / GRN / Invoice / Payment; + supplier-upload reconciliation.
 * ============================================================*/
function soaParseDMY(s){if(!s)return null;var p=String(s).split('/');if(p.length!==3)return null;return new Date(+p[2],+p[1]-1,+p[0]);}
function soaDaysAgo(s){var d=soaParseDMY(s);if(!d)return 0;return Math.round((new Date(2026,5,28)-d)/86400000);}
function posForVendor(vid){return (DATA.pos||[]).filter(function(p){return p.vendorId===vid;});}
function postedInv(vid){return invForVendor(vid).filter(function(i){return ['Approved','Paid'].includes(i.status);});}
function paidVch(vid){return vchForVendor(vid).filter(function(v){return v.status==='Paid';});}
function soaInvoiced(vid){return postedInv(vid).reduce(function(a,i){return a+invTotal(i);},0);}
function soaPaid(vid){return paidVch(vid).reduce(function(a,v){return a+vchNet(v);},0);}
function soaBalance(vid){return soaInvoiced(vid)-soaPaid(vid);}
function grnsForVendor(vid){return (DATA.grns||[]).filter(function(g){var po=poById(g.poId);return po&&po.vendorId===vid;});}
function grnValue(g){var po=poById(g.poId);if(!po)return 0;return g.lines.reduce(function(a,l){var pl=poLineByCode(po,l.code);return a+(l.receivedQty||0)*(pl?pl.price:0);},0);}
function poRecvValue(po){return po.lines.reduce(function(a,l){return a+(l.recv||0)*l.price;},0);}
function soaGRNI(vid){return posForVendor(vid).reduce(function(a,po){var inv=postedInv(vid).filter(function(i){return i.poId===po.id;}).reduce(function(b,i){return b+invSubtotal(i);},0);return a+Math.max(0,poRecvValue(po)-inv);},0);}
function soaVendorIds(){var s={};(DATA.pos||[]).forEach(function(p){s[p.vendorId]=1;});(DATA.invoices||[]).forEach(function(i){s[i.vendorId]=1;});(DATA.vouchers||[]).forEach(function(v){s[v.vendorId]=1;});return Object.keys(s);}
function soaLedger(vid){var e=[];
  posForVendor(vid).forEach(function(p){if(p.status!=='Draft')e.push({ds:p.date,type:'PO issued',ref:p.id,credit:0,debit:0,memo:poValue(p)});});
  grnsForVendor(vid).forEach(function(g){e.push({ds:g.receivedDate,type:'Goods receipt',ref:g.id,credit:0,debit:0,memo:grnValue(g)});});
  postedInv(vid).forEach(function(i){e.push({ds:i.date,type:'Invoice',ref:i.id,credit:invTotal(i),debit:0});});
  paidVch(vid).forEach(function(v){e.push({ds:v.paymentDate,type:'Payment',ref:v.id,credit:0,debit:vchNet(v)});});
  e.sort(function(a,b){var da=soaParseDMY(a.ds),db=soaParseDMY(b.ds);return (da?da.getTime():0)-(db?db.getTime():0);});
  var bal=0;e.forEach(function(x){bal+=x.credit-x.debit;x.bal=bal;});
  return e;
}
function soaAging(vid){var b={cur:0,d30:0,d60:0,d90:0};invForVendor(vid).filter(function(i){return i.status==='Approved';}).forEach(function(i){var age=soaDaysAgo(i.date);var amt=invTotal(i);if(age<=30)b.cur+=amt;else if(age<=60)b.d30+=amt;else if(age<=90)b.d60+=amt;else b.d90+=amt;});return b;}

      <div class="card stat"><div class="lbl">GRNI accrual</div><div class="num" style="font-size:20px">RM ${fmt(totGRNI)}</div><div class="sub">received, not invoiced</div></div>
      <div class="card stat"><div class="lbl">Vendors with balance</div><div class="num">${withBal}</div><div class="sub">outstanding</div></div>
    </div>
    <div class="card"><table><thead><tr><th>Vendor</th><th class="amt">Invoiced</th><th class="amt">Paid</th><th class="amt">Open balance</th><th class="amt">GRNI</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;

    <div class="grid g4" style="margin-bottom:16px">
      <div class="card stat"><div class="lbl">Open balance</div><div class="num" style="font-size:19px;color:var(--teal)">RM ${fmt(soaBalance(vid))}</div><div class="sub">payable</div></div>
      <div class="card stat"><div class="lbl">Invoiced</div><div class="num" style="font-size:19px">RM ${fmt(soaInvoiced(vid))}</div><div class="sub">incl. SST</div></div>
      <div class="card stat"><div class="lbl">Paid</div><div class="num" style="font-size:19px">RM ${fmt(soaPaid(vid))}</div><div class="sub">net released</div></div>
      <div class="card stat"><div class="lbl">GRNI</div><div class="num" style="font-size:19px">RM ${fmt(soaGRNI(vid))}</div><div class="sub">to be invoiced</div></div>
    </div>
    ${soaAgingCard(vid)}
    <div class="card"><div class="chead"><h3>Ledger</h3><div class="spacer"></div><span class="hint">PO · goods receipt · invoice · payment</span></div>${soaLedgerTable(vid)}</div>`;
}

/* ====================== VENDOR: statement + reconciliation ====================== */
function venStatement(){var vid=S.vendorId;
  var recon = S.soaUp ? venSOARecon(vid) : `
    <div class="card"><div class="cbody" style="text-align:center;padding:38px">
      <div style="margin-bottom:10px">${I('upload',30,'#9aa7ad')}</div>
      <div style="font-weight:700;margin-bottom:4px">Reconcile your statement</div>
      <p class="hint" style="max-width:430px;margin:0 auto 16px">Upload your own statement of account and we'll reconcile it against our records — invoices and payments — and flag any differences.</p>
      <button class="btn btn-pri" onclick="S.soaUp=true;render()">${I('upload',15,'#fff')} Upload SOA (PDF / Excel)</button></div></div>`;
  $('main').innerHTML=`
    <div class="pagehead"><div><h1>Statement of Account</h1><p>Your account with ${DATA.buyer.name} — invoices billed, payments received, and open balance.</p></div></div>
    <div class="grid g3" style="margin-bottom:16px">
      <div class="card stat"><div class="lbl">Balance owed to you</div><div class="num" style="font-size:19px;color:var(--teal)">RM ${fmt(soaBalance(vid))}</div></div>
      <div class="card stat"><div class="lbl">Invoiced</div><div class="num" style="font-size:19px">RM ${fmt(soaInvoiced(vid))}</div></div>
      <div class="card stat"><div class="lbl">Paid to you</div><div class="num" style="font-size:19px">RM ${fmt(soaPaid(vid))}</div></div>
    </div>
    <div class="card" style="margin-bottom:16px"><div class="chead"><h3>Ledger</h3><div class="spacer"></div><span class="hint">as at 28/06/2026</span></div>${soaLedgerTable(vid)}</div>
    ${recon}`;
}
function venSOARecon(vid){var inv=postedInv(vid);
  var soaT=0,sysT=0;
  var rows=inv.map(function(i,ix){var sys=invTotal(i);var soa=ix===0?sys+1080:sys;soaT+=soa;sysT+=sys;var status=soa===sys?'Matched':'Variance';return `<tr><td style="font-weight:600">${i.id}</td><td class="amt">RM ${fmt(soa)}</td><td class="amt">RM ${fmt(sys)}</td><td class="amt">${(soa-sys)!==0?'<span style="color:var(--red)">RM '+fmt(soa-sys)+'</span>':'—'}</td><td><span class="badge ${status==='Matched'?'b-green':'b-amber'}">${status}</span></td></tr>`;}).join('');
  rows+=`<tr><td style="font-weight:600">${venById(vid).name.slice(0,3).toUpperCase()}-INV-9907</td><td class="amt">RM 3,200</td><td class="amt">—</td><td class="amt"><span style="color:var(--red)">RM 3,200</span></td><td><span class="badge b-red">Not in system</span></td></tr>`;
  soaT+=3200;var diff=soaT-sysT;
  return `
    <div class="grid g3" style="margin-bottom:16px">
      <div class="card stat"><div class="lbl">Per your SOA</div><div class="num" style="font-size:18px">RM ${fmt(soaT)}</div></div>
      <div class="card stat"><div class="lbl">Per our records</div><div class="num" style="font-size:18px">RM ${fmt(sysT)}</div></div>
      <div class="card stat"><div class="lbl">Difference</div><div class="num" style="font-size:18px;color:${diff?'var(--red)':'var(--green)'}">RM ${fmt(diff)}</div></div>
    </div>
    <div class="card"><div class="chead"><h3>SOA reconciliation</h3><div class="spacer"></div><span class="badge b-green">${I('check',11)} Auto-matched</span> <button class="btn btn-out btn-sm" style="margin-left:8px" onclick="S.soaUp=false;render()">Re-upload</button></div>
      <table><thead><tr><th>Reference</th><th class="amt">Per SOA</th><th class="amt">Per records</th><th class="amt">Variance</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="cbody"><div style="background:#fbeded;color:#9c3a30;border-radius:10px;padding:10px 12px;font-size:12.5px">${I('flag',14,'var(--red)')} Variances and unmatched items are flagged to the buyer's AP team for resolution before payment.</div></div></div>`;
}

/* boot */
render();
</script>
</body>
</html>
