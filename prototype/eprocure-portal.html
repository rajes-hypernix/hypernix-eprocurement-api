<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hypernix eProcure — Sourcing &amp; Vendor Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#336374; --teal-d:#27505f; --teal-l:#5a8298; --teal-nav:#25586B; --accent:#2C5C6E;
    --cream:#F3EFE9; --card:#F6F4EF; --ink:#2b2b2b; --muted:#7d8a93;
    --line:#E4DED2; --soft:#f7f5f1;
    --amber:#E08A3C; --amber-bg:#FBEFDF; --green:#3f8f5f; --green-bg:#E7F2EB;
    --red:#C5564B; --red-bg:#FBE9E7; --blue:#3b6ea5; --blue-bg:#E8F0F8;
    --radius:0; --shadow:0 2px 10px rgba(51,99,119,0.08); --shadow-l:0 8px 30px rgba(51,99,119,0.16);
    --sans:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);background:var(--cream);color:var(--ink);font-size:14px;line-height:1.45}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit;text-decoration:none}
  .hidden{display:none!important}

  /* ---- Top bar ---- */
  .topbar{height:58px;background:var(--teal);color:#fff;display:flex;align-items:center;padding:0 22px;gap:18px;position:sticky;top:0;z-index:50}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.2px}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
  .brand small{font-weight:500;opacity:.7;font-size:11px;display:block;letter-spacing:.4px}
  .topbar .spacer{flex:1}
  .roleswitch{display:flex;background:rgba(255,255,255,.13);border-radius:10px;padding:3px}
  .roleswitch button{background:transparent;border:none;color:rgba(255,255,255,.8);padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600}
  .roleswitch button.on{background:#fff;color:var(--teal)}
  .whoami{display:flex;align-items:center;gap:9px;font-size:12.5px}
  .whoami .av{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .whoami select{background:rgba(255,255,255,.13);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 8px;font-size:12px;font-family:inherit}
  .whoami select option{color:#000}

  /* ---- Shell ---- */
  .shell{display:flex;min-height:calc(100vh - 58px)}
  .side{width:222px;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;flex-shrink:0}
  .side .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 10px 6px}
  .nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#54606a;font-weight:600;font-size:13.5px;margin-bottom:2px}
  .nav:hover{background:var(--soft)}
  .nav.on{background:var(--teal-nav);color:#fff}
  .nav .ic{display:flex}
  .nav .count{margin-left:auto;background:var(--amber);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
  .nav.on .count{background:rgba(255,255,255,.25)}
  .main{flex:1;padding:26px 30px;max-width:1280px;width:100%}

  /* ---- Bits ---- */
  .pagehead{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
  .pagehead h1{font-size:21px;margin:0 0 3px;font-family:var(--serif)}
  .pagehead p{margin:0;color:var(--muted);font-size:13px}
  .pagehead .spacer{flex:1}
  .actbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .actbar-foot{margin-top:18px}
  .pbar{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--teal)}
  .mrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .rowlink{cursor:pointer}
  .crumb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;margin-bottom:10px}
  .crumb a{color:var(--accent);font-weight:600;cursor:pointer}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card .cbody{padding:18px 20px}
  .card .chead{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .card .chead h3{margin:0;font-size:15px;font-family:var(--serif)}
  .card .chead .spacer{flex:1}

  .stat{padding:16px 18px}
  .stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .stat .num{font-size:26px;font-weight:700;margin-top:4px;color:var(--teal);font-family:var(--serif)}
  .stat .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .grid{display:grid;gap:16px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}

  .btn{border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
  .btn-pri{background:var(--teal);color:#fff}
  .btn-pri:hover{background:var(--teal-d)}
  .btn-pri:disabled{background:#cfcabf;cursor:not-allowed}
  .btn-out{background:#fff;color:#445;border:1px solid var(--line)}
  .btn-out:hover{background:var(--soft)}
  .btn-amber{background:var(--amber);color:#fff}
  .btn-amber:hover{filter:brightness(.95)}
  .btn-ghost{background:transparent;color:var(--teal);border:1px solid transparent;padding:7px 10px}
  .btn-ghost:hover{background:var(--soft)}
  .btn-sm{padding:6px 11px;font-size:12px}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;background:var(--soft)}
  td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:#fcfbf9}
  .amt{text-align:right;font-variant-numeric:tabular-nums}

  .badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink);background:none!important;padding:0;border-radius:0;white-space:nowrap}
  .badge::before{content:'';width:7px;height:7px;border-radius:50%;flex-shrink:0;background:#aab0b6}
  .badge.b-amber{color:var(--ink)} .badge.b-amber::before{background:#d2952f}
  .badge.b-green{color:var(--ink)} .badge.b-green::before{background:#2f9e6e}
  .badge.b-blue{color:var(--ink)}  .badge.b-blue::before{background:#3f78c2}
  .badge.b-red{color:var(--ink)}   .badge.b-red::before{background:#cf5149}
  .badge.b-grey{color:var(--ink)}  .badge.b-grey::before{background:#aab0b6}
  .badge.b-teal{color:var(--ink)}  .badge.b-teal::before{background:var(--teal)}
  .env-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
  /* standalone colour classes (used outside .badge) keep their fill */
  .b-amber{background:var(--amber-bg);color:#9a5a1c}
  .b-green{background:var(--green-bg);color:#256b41}
  .b-blue{background:var(--blue-bg);color:#2d557f}
  .b-red{background:var(--red-bg);color:#9c3a30}
  .b-grey{background:#eee9e1;color:#6f6a60}
  .b-teal{background:#e3edf0;color:var(--teal-d)}

  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}

  .check{appearance:none;width:18px;height:18px;border:1.7px solid #c3bdb1;border-radius:5px;position:relative;cursor:pointer;flex-shrink:0;background:#fff;vertical-align:middle}
  .check:checked{background:var(--teal);border-color:var(--teal)}
  .check:checked::after{content:'';position:absolute;left:5px;top:1.5px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

  input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{
    width:100%;padding:9px 11px;border:1px solid #d6cfc3;border-radius:9px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(51,99,119,.13)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11.5px;font-weight:600;color:#5a6670;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
  .hint{font-size:11.5px;color:var(--muted)}

  /* stepper */
  .steps{display:flex;align-items:center;gap:6px;margin-bottom:22px;flex-wrap:wrap}
  .step{display:flex;align-items:center;gap:9px;padding:8px 14px;border-radius:30px;font-size:12.5px;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line)}
  .step .n{width:21px;height:21px;border-radius:50%;background:#e9e3da;color:#8a8174;display:flex;align-items:center;justify-content:center;font-size:11px}
  .step.on{color:#fff;background:var(--teal);border-color:var(--teal)}
  .step.on .n{background:rgba(255,255,255,.25);color:#fff}
  .step.done{color:var(--teal);border-color:#cfe0e5}
  .step.done .n{background:var(--teal);color:#fff}
  .steps .sep{flex:0 0 18px;height:1px;background:var(--line)}

  /* envelope */
  .env{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff}
  .env .etop{padding:16px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
  .env .seal{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .env.tech .seal{background:#ecebf6;color:#5b56b0}
  .env.comm .seal{background:#e6f1ec;color:#2f7d56}
  .env .ebody{padding:16px 18px}
  .env .locked-note{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;background:var(--soft);padding:10px 12px;border-radius:9px}

  .ribbon{display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,#eaf1f3,#f4f1ec);border:1px solid #d9e3e6;border-radius:12px;padding:11px 15px;font-size:12.5px;color:var(--teal-d);margin-bottom:18px}
  .ns{display:inline-flex;align-items:center;gap:6px;background:#1c2b36;color:#fff;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.3px}

  .vcol{min-width:200px}
  .comp-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
  .comp{border-collapse:separate;border-spacing:0;min-width:760px}
  .comp th,.comp td{white-space:nowrap}
  .comp .best{background:#eef6f1!important}
  .comp .lo{color:var(--green);font-weight:700}
  .pricecell{display:flex;flex-direction:column;gap:2px}
  .pricecell .big{font-weight:700;font-variant-numeric:tabular-nums}
  .pricecell .meta{font-size:10.5px;color:var(--muted)}

  .thread{display:flex;flex-direction:column;gap:12px}
  .msg{max-width:78%;padding:11px 14px;border-radius:13px;font-size:13px}
  .msg .who{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;opacity:.7}
  .msg.them{background:var(--soft);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
  .msg.me{background:var(--teal);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .msg .time{font-size:10px;opacity:.6;margin-top:4px}

  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:600;margin:0 6px 6px 0}
  .chip .x{cursor:pointer;color:var(--red);font-weight:800}
  .file{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--soft);font-size:12.5px;margin-bottom:7px}
  .file .ext{width:30px;height:30px;border-radius:7px;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(30,26,22,.42);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:16px;box-shadow:var(--shadow-l);width:480px;max-width:100%;max-height:90vh;overflow:auto}
  .modal .mhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .modal .mhead h3{margin:0;font-size:16px}
  .modal .mbody{padding:20px 22px}
  .modal .mfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#23323d;color:#fff;padding:13px 20px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:var(--shadow-l);display:flex;align-items:center;gap:10px;z-index:200;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{text-align:center;padding:48px 20px;color:var(--muted)}
  .empty .ic{display:flex;justify-content:center;margin-bottom:10px;opacity:.5}
  .alloc-bar{height:7px;border-radius:6px;background:#ece7df;overflow:hidden;margin-top:5px}
  .alloc-bar i{display:block;height:100%;background:var(--teal)}

  /* ---- Requisitions v2 (dense grid + filters + line drawer) ---- */
  .fbar2{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:0 0 14px}
  .fitem2{display:flex;flex-direction:column;gap:4px}
  .fitem2 label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .fitem2 select{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);min-width:128px}
  .freset{background:none;border:none;color:var(--teal);font-weight:600;font-size:12.5px;cursor:pointer;padding:8px 4px}
  .fbar2{position:relative;z-index:111}
  .msel{position:relative;display:flex;flex-direction:column;gap:4px}
  .msel>label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .mbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:128px;font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);cursor:pointer}
  .mbtn.has{border-color:var(--teal);color:var(--teal-d);font-weight:600}
  .mchev{display:inline-flex;transform:rotate(90deg);transition:transform .15s;color:var(--muted)}
  .mchev.up{transform:rotate(-90deg);color:var(--teal)}
  .mpop{position:absolute;top:100%;left:0;margin-top:5px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-l);z-index:115;min-width:190px;max-height:248px;overflow:auto;padding:5px}
  .mopt{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink);font-weight:500;padding:6px 8px;border-radius:7px;cursor:pointer}
  .mopt:hover{background:var(--soft)}
  .mopt input{margin:0;flex-shrink:0}
  .mpopf{border-top:1px solid var(--line);margin-top:4px;padding:7px 8px 2px}
  .mpopf button{background:none;border:none;color:var(--teal);font-weight:600;font-size:12px;cursor:pointer;padding:0}
  .mscrim{position:fixed;inset:0;z-index:110;background:transparent}
  .abar2{display:flex;align-items:center;gap:12px;padding:11px 16px;border:1px solid var(--line);border-radius:12px;margin:0 0 14px;background:var(--soft)}
  .abar2.live{background:#eaf3f5;border-color:#cfe2e6}
  .abar2 .info{font-size:13px;color:var(--muted)}
  .abar2 .info b{font-weight:700;color:var(--ink)}
  .abar2.live .info{color:var(--teal-d)}
  .abar2.live .info b{color:var(--teal-d)}
  .abar2 .sp{flex:1}
  .rq table{width:100%;border-collapse:collapse;table-layout:fixed}
  .rq th{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;text-align:left;color:var(--muted);padding:10px 9px;border-bottom:1px solid var(--line)}
  .rq td{padding:9px 9px;border-bottom:1px solid var(--line);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
  .rq tr:last-child td{border-bottom:none}
  .rq .amt{text-align:right;font-variant-numeric:tabular-nums}
  .rq .prrow{cursor:pointer}
  .rq .prrow:hover td{background:var(--soft)}
  .rq .prrow.open td{background:#eef5f6}
  .rq .prrow.grp td{box-shadow:inset 3px 0 0 var(--teal)}
  .rq .prid{color:var(--teal);font-weight:700}
  .rq .chev{display:inline-block;transition:transform .15s;vertical-align:-2px;color:var(--muted)}
  .rq .prrow.open .chev{transform:rotate(90deg);color:var(--teal)}
  .lst{font-size:11.5px;display:inline-flex;align-items:center;gap:4px;margin-right:8px;font-weight:600}
  .lst .d{width:7px;height:7px;border-radius:50%;display:inline-block}
  .lst.a{color:var(--green)} .lst.a .d{background:var(--green)}
  .lst.r{color:#b9762a} .lst.r .d{background:var(--amber)}
  .lst.w{color:var(--blue)} .lst.w .d{background:var(--blue)}
  .lst.c{color:var(--red)} .lst.c .d{background:var(--red)}
  .rqtools{display:flex;justify-content:flex-end;gap:8px;margin:0 0 8px}
  .rqtools .freset{padding:4px 8px}
  .linetab{width:100%;border-collapse:collapse;font-size:12px}
  .linetab th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);text-align:left;padding:7px 12px;background:#eef0ee;border-bottom:1px solid var(--line)}
  .linetab td{padding:6px 12px;border-bottom:1px solid #ededea}
  .linetab tr:last-child td{border-bottom:none}
  .linetab .amt{text-align:right;font-variant-numeric:tabular-nums}
  .rqscrim{position:fixed;inset:0;background:rgba(30,26,22,.42);z-index:140}
  .rqdrawer{position:fixed;top:0;right:0;bottom:0;width:540px;max-width:92vw;background:#fff;z-index:141;display:flex;flex-direction:column;box-shadow:var(--shadow-l)}
  .rqdrawer .dh{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .rqdrawer .dh h3{margin:0;font-size:16px}
  .rqdrawer .dh .x{margin-left:auto;background:none;border:none;font-size:24px;line-height:1;color:var(--muted);cursor:pointer}
  .rqdrawer .db{flex:1;overflow:auto}
  .rqdrawer .dsub{display:flex;align-items:center;gap:14px;padding:9px 20px;border-bottom:1px solid var(--line);background:#fbfbf9}
  .rqdrawer .dsub .sp{flex:1}
  .rqdrawer .dsub .lbl{font-size:12px;color:var(--muted)}
  .rqdrawer .dsub button{background:none;border:none;color:var(--teal);font-weight:600;font-size:12.5px;cursor:pointer;padding:0}
  .psec2{padding:13px 20px;border-bottom:1px solid var(--line)}
  .psec2 .ph{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .psec2 .ph .pid{font-weight:700;color:var(--teal);font-size:13px}
  .psec2 .ph .pc{font-size:12px;color:var(--muted)}
  .psec2 .selall{margin-left:auto;font-size:12px;color:var(--teal);background:none;border:none;cursor:pointer;font-weight:600}
  .lrow2{display:flex;align-items:flex-start;gap:11px;padding:8px 0;cursor:pointer}
  .lrow2.lock{opacity:.55;cursor:default}
  .lrow2 input{margin-top:3px;flex-shrink:0}
  .lrow2 .lc{flex:1;min-width:0}
  .lrow2 .desc{color:var(--ink);font-size:13px}
  .lrow2 .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .lrow2 .amt2{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;white-space:nowrap}
  .lockchip{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;margin-top:2px}
  .rqdrawer .df{border-top:1px solid var(--line);padding:14px 20px;background:var(--soft)}
  .rqdrawer .df .note{font-size:11.5px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .rqdrawer .df .frow{display:flex;align-items:center;gap:12px}
  .rqdrawer .df .tot{font-size:15px;font-weight:700;color:var(--ink)}
  .rqdrawer .df .sp{flex:1}

  /* RFQ builder step 0 — source PRs + Add PRs drawer */
  .rfqlt{width:100%;border-collapse:collapse;table-layout:fixed}
  .rfqlt th{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;text-align:left;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line)}
  .rfqlt td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rfqlt tr:last-child td{border-bottom:none}
  .rfqlt .amt{text-align:right;font-variant-numeric:tabular-nums}
  .rfqlt .prtag{color:var(--teal);font-weight:700}
  .rfqlt tr.firstof td{border-top:2px solid #e3ecec}
  .srcsec{margin:22px 0 10px;font-size:15px;font-weight:700}
  .prc{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff}
  .prc .prh{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
  .prc .prh:hover{background:var(--soft)}
  .prc .prh .chev{color:var(--muted);transition:transform .15s;display:inline-flex;vertical-align:-2px}
  .prc.open .prh .chev{transform:rotate(90deg);color:var(--teal)}
  .prc .prh .pid{font-weight:700;color:var(--teal)}
  .prc .prh .who{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prc .prh .sp{flex:1}
  .prc .inb{font-size:11.5px;padding:3px 10px;border-radius:20px;background:#eaf3f5;color:var(--teal-d);white-space:nowrap;font-weight:600}
  .prc .prb{border-top:1px solid var(--line);padding:14px;background:var(--soft)}
  .prc .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 18px;margin-bottom:13px}
  .prc .meta .k{font-size:11px;color:var(--muted);margin-bottom:1px}
  .prc .meta .v{font-size:12.5px;color:var(--ink)}
  .prc .mlt{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .prc .mlt th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);text-align:left;padding:7px 11px;border-bottom:1px solid var(--line)}
  .prc .mlt td{font-size:12px;padding:7px 11px;border-bottom:1px solid #ededea}
  .prc .mlt tr:last-child td{border-bottom:none}
  .prc .mlt .amt{text-align:right;font-variant-numeric:tabular-nums}
  .prc .mlt tr.out td{color:var(--muted)}
  .inmark{color:var(--teal-d);display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600}
  .outmark{color:var(--green);display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600}
  .outmark .dd{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--green)}
  .addscrim{position:fixed;inset:0;background:rgba(30,26,22,.42);z-index:130}
  .adddrawer{position:fixed;top:0;right:0;bottom:0;width:88vw;max-width:1180px;background:#fff;z-index:131;display:flex;flex-direction:column;box-shadow:var(--shadow-l)}
  .adddrawer .dh{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .adddrawer .dh h3{margin:0;font-size:16px}
  .adddrawer .dh .x{margin-left:auto;background:none;border:none;font-size:24px;line-height:1;color:var(--muted);cursor:pointer}
  .adddrawer .adddb{flex:1;overflow:auto;padding:20px 22px}

  /* ---- Question form editor (phase 1) ---- */
  .qpick{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
  .qpick>label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .qpick select{max-width:340px;font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  .qgroup{border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
  .qghead{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--soft);border-radius:12px 12px 0 0}
  .qgtitle{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
  .envdot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .envdot.commercial{background:var(--amber)} .envdot.technical{background:var(--teal)}
  .qgsub{font-size:11px;color:var(--muted)}
  .qghead .sp{flex:1}
  .qmwrap{position:relative}
  .qmenu{position:absolute;top:100%;right:0;margin-top:5px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-l);z-index:30;padding:5px;min-width:180px;display:flex;flex-direction:column;max-height:280px;overflow:auto}
  .qmenu button{text-align:left;font-size:12.5px;background:none;border:none;color:var(--ink);padding:7px 9px;border-radius:7px;cursor:pointer}
  .qmenu button:hover{background:var(--soft)}
  .qmsep{height:1px;background:var(--line);margin:4px 0}
  .qmscrim{position:fixed;inset:0;z-index:20;background:transparent}
  .qsec{padding:6px 14px 12px;border-bottom:1px solid var(--line)}
  .qsec:last-child{border-bottom:none}
  .qsechead{display:flex;align-items:center;gap:4px;margin:6px 0 8px}
  .secname{font-size:11px;font-weight:700;color:var(--teal-d);border:none;background:none;padding:4px 4px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px;min-width:160px}
  .secname:hover{background:#eef5f6} .secname:focus{outline:none;background:#eef5f6}
  .qempty{font-size:12px;color:var(--muted);padding:6px 2px}
  .qmuted{color:var(--muted)}
  .qitem{border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#fff}
  .qih{display:flex;align-items:center;gap:9px;padding:9px 11px}
  .qih .grip{color:var(--muted);cursor:grab;font-size:13px;letter-spacing:-2px}
  .qih .qlabel{flex:1;font-size:13px;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qih .chip{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--soft);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
  .qih .chip.ck-i{background:#eef2f6;color:#5a7184;border-color:#dce6ee}
  .qih .chip.ck-t{background:#fbeee0;color:#b9762a;border-color:#f0dcc4}
  .qreq{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
  .qreq.on{background:#eaf3f5;color:var(--teal-d);border-color:#cfe2e6}
  .qih .ic{color:var(--muted);cursor:pointer;display:inline-flex}
  .qih .ic.del{color:var(--red)}
  .exch{transition:transform .15s}
  .qitem.open .exch{transform:rotate(90deg);color:var(--teal)}
  .qbody{border-top:1px solid var(--line);padding:12px 12px 4px;background:#fbfbf9}
  .qbody .field{margin-bottom:10px}
  .qbody input[type=text],.qbody select,.qbody textarea{width:100%;font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  .qbody textarea{resize:vertical}
  .optrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .optrow input{flex:1}
  .lnk{background:none;border:none;cursor:pointer;display:inline-flex;padding:2px}
  .ck{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);font-weight:500}

  /* ---- Vendor form renderer (phase 5) ---- */
  .vitem{margin-bottom:14px}
  .vlab{display:block;font-size:13px;color:var(--ink);font-weight:600;margin-bottom:6px}
  .vreq{color:var(--red);font-weight:700}
  .vsec{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--teal-d);margin:6px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .vinstr{display:flex;gap:9px;align-items:flex-start;background:#f3f6f8;border:1px solid #e2e9ee;border-radius:9px;padding:10px 12px;margin-bottom:14px;font-size:12.5px;color:#4a5b67;line-height:1.5}
  .vterms{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--ink);line-height:1.55;margin-bottom:8px;max-height:140px;overflow:auto}
  .vinline{display:flex;align-items:center;gap:8px}
  .vunit{font-size:12px;color:var(--muted);font-weight:600}
  .vmulti{display:flex;flex-direction:column;gap:7px}
  .vmiss{outline:2px solid var(--red);outline-offset:4px;border-radius:8px}
  .vtblwrap{overflow:auto;border:1px solid var(--line);border-radius:9px}
  .vtbl{width:100%;border-collapse:collapse;min-width:360px}
  .vtbl th,.vtbl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
  .vtbl th{background:var(--soft);font-size:11px;font-weight:700;color:var(--muted);padding:7px 9px;text-align:right;white-space:nowrap}
  .vtbl th:first-child{text-align:left}
  .vtbl td.rh{padding:7px 9px;font-size:12.5px;color:var(--ink);font-weight:600;background:#fcfcfb;white-space:nowrap}
  .vtbl td input{border:none;border-radius:0;width:100%;text-align:right;padding:7px 9px;font-size:12.5px;background:transparent}
  .vtbl td input:focus{outline:2px solid var(--teal);outline-offset:-2px}
  .vtbl tr:last-child th,.vtbl tr:last-child td{border-bottom:none}
  .vtbl th:last-child,.vtbl td:last-child{border-right:none}
  .vgroup{border:1px dashed var(--line);border-radius:9px;padding:10px;background:#fcfcfb}
  .ventry{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:#fff}
  .ventryhd{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px}
  .vgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
  .vgrid .field{margin:0}

  /* ---- Form library (phase 4) ---- */
  .formname{font-size:22px;font-weight:800;border:none;background:none;color:var(--ink);padding:2px 0;width:100%;font-family:inherit;letter-spacing:-.3px}
  .formname:focus{outline:none;border-bottom:2px solid var(--teal)}
  .qsavebar{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}

  /* ---- Vendor master (phase B) ---- */
  .swchip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;background:#eef5f6;color:var(--teal-d);border:1px solid #d6e6e9;margin:2px 4px 2px 0;white-space:nowrap}
  .vtabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
  .vtab{font-size:13px;padding:9px 14px;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .vtab:hover{color:var(--ink)}
  .vtab.on{color:var(--teal-d);border-bottom-color:var(--teal);font-weight:700}
  .vkv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
  .vkv:last-child{border-bottom:none}
  .vkv .vv{font-weight:600;text-align:right}
  .swrow{display:flex;align-items:center;gap:8px;padding:6px 0}
  .swpath{flex:1;font-size:13px}
  .swcode{font-family:var(--mono,monospace);font-size:11px;color:var(--muted);background:var(--soft);padding:2px 7px;border-radius:6px}
  .ctc{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .ctc:last-child{border-bottom:none}
  .ctc-av{width:38px;height:38px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
  .addr{border:1px solid var(--line);border-radius:10px;padding:12px}
  .pbar{height:7px;background:var(--soft);border-radius:5px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--teal);border-radius:5px}

  /* ---- SWEC category picker (phase C) ---- */
  .swtree{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 4px;background:#fff}
  .swnode{display:flex;align-items:center;gap:2px;padding:1px 4px}
  .swind{flex-shrink:0}
  .swtw{width:18px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s}
  .swtw.open{transform:rotate(90deg)}
  .swtw.leaf{cursor:default}
  .swck{display:flex;align-items:center;gap:8px;flex:1;font-size:13px;padding:5px 4px;border-radius:6px;cursor:pointer;min-width:0}
  .swck:hover{background:var(--soft)}
  .swnm{flex:1}
  .swnm.grp{font-weight:700}
  .swc3{font-family:var(--mono,monospace);font-size:10.5px;color:var(--muted);background:var(--soft);padding:1px 6px;border-radius:5px}
  .swcnt{font-size:10.5px;color:var(--muted);background:var(--soft);min-width:20px;text-align:center;padding:1px 6px;border-radius:10px}
  .swsel{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

  /* ---- Vendor selection filter (phase D) ---- */
  .swchip.hit{background:var(--teal);color:#fff;border-color:transparent}
  .seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg2 button{font-size:12px;padding:6px 12px;border:none;background:#fff;color:var(--muted);cursor:pointer}
  .seg2 button.on{background:var(--teal);color:#fff}
  .vpick{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
  .vpick:hover{border-color:var(--teal-d)}
  .vpick.on{border-color:var(--teal);background:#eef5f6}
  .vck{width:18px;height:18px;flex-shrink:0;border:1.5px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center}
  .vpick.on .vck{background:var(--teal);border-color:var(--teal)}
  .cattree{margin-top:6px;border-top:1px solid var(--line);padding-top:4px}

  /* ---- grouped AND/OR + vendor expand (phase E) ---- */
  .andsep{font-size:9.5px;color:var(--muted);margin:0 4px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
  .orsep{display:inline-block;font-size:10px;color:var(--teal-d);font-weight:800;margin:0 7px;text-transform:uppercase;letter-spacing:.05em}
  .grpwrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:11px}
  .grpbox{display:inline-flex;align-items:center;gap:2px;flex-wrap:wrap;padding:6px 9px;border:1.5px dashed var(--line);border-radius:10px;cursor:pointer;background:#fff}
  .grpbox.active{border-style:solid;border-color:var(--teal);background:#eef5f6}
  .grpdel{margin-left:4px;cursor:pointer;display:inline-flex;align-items:center}
  .grpadd{border-style:dashed!important}
  .vmcar{display:inline-flex;transition:transform .12s}
  .vmcar.open{transform:rotate(90deg)}
  .vmx>td{background:var(--soft);padding:0!important;border-top:none}
  .vmxbody{padding:14px 16px;border-left:3px solid var(--teal)}

  /* ---- precise question insertion (phase G) ---- */
  .qins{position:relative;height:11px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .12s}
  .qins:hover,.qins.open{opacity:1}
  .qins::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--teal);opacity:.35}
  .qinsbtn{position:relative;z-index:2;display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;background:#fff;border:1px solid var(--teal);color:var(--teal-d);border-radius:20px;padding:1px 10px;cursor:pointer;line-height:1.7}
  .qaddwrap{position:relative;margin-top:8px}
  .qaddbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;font-size:12.5px;font-weight:600;background:none;border:1px dashed var(--line);color:var(--muted);border-radius:9px;padding:9px 12px;cursor:pointer}
  .qaddbtn:hover,.qaddbtn.on{border-color:var(--teal);color:var(--teal-d);background:#fff}
  .qins .qmenu{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;z-index:40}
  .qaddwrap .qmenu{position:absolute;top:100%;left:0;margin-top:4px;z-index:40}
  .ic.mv{cursor:pointer;font-size:9px;color:var(--muted);padding:0 1px;user-select:none}
  .ic.mv:hover{color:var(--teal-d)}

  .fcaret{display:inline-flex;transition:transform .12s}
  .fcaret.open{transform:rotate(90deg)}

  /* ---- form drag & drop (phase K) ---- */
  .qitem .grip{cursor:grab}
  .qitem.dragging{opacity:.45}
  .qitem.dropbefore{box-shadow:inset 0 3px 0 var(--teal)}
  .qitem.dropafter{box-shadow:inset 0 -3px 0 var(--teal)}
  .qsec.dropsec{outline:2px dashed var(--teal);outline-offset:3px;border-radius:10px;background:rgba(47,125,140,.05)}

  .scoreinput{width:62px;text-align:center;padding:6px 4px;border:1px solid var(--line);border-radius:7px;font-size:13px}

  /* ---- floating clarification widget ---- */
  #chatDock{position:fixed;right:18px;bottom:0;z-index:300;display:flex;align-items:flex-end;gap:12px}
  #chatDock *{box-sizing:border-box}
  .chat-col{display:flex;flex-direction:column;align-items:flex-end;gap:10px;margin-bottom:14px}
  .chat-launcher{display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:#fff;border:none;border-radius:24px;padding:11px 16px 11px 12px;font-size:13.5px;font-weight:700;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;box-shadow:0 8px 24px rgba(51,99,119,.35);position:relative}
  .chat-launcher:active{cursor:grabbing}
  .cgrip{flex:none;opacity:.5}
  .chat-launcher:hover{background:var(--teal-d)}
  .chat-badge{background:#cf5149;color:#fff;border-radius:10px;font-size:11px;font-weight:700;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
  .chat-badge.launch{position:absolute;top:-4px;right:-4px}
  .chat-pop{width:300px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);overflow:hidden}
  .chat-pop-hd{padding:12px 14px;font-weight:700;border-bottom:1px solid var(--line);font-size:14px}
  .chat-pop-bd{max-height:340px;overflow:auto}
  .chat-row{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
  .chat-row:hover{background:var(--soft)}
  .crmeta{flex:1;min-width:0}
  .crname{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
  .cropen{color:#2f9e6e;font-weight:700;font-size:10px}
  .crsub{font-size:11px;color:var(--muted)}
  .crlast{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .cav{width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .chat-win{width:300px;height:392px;background:var(--card);border:1px solid var(--line);border-bottom:none;border-radius:14px 14px 0 0;box-shadow:0 12px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden}
  .chat-win.min{height:auto}
  .chat-hd{display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;background:var(--teal);color:#fff}
  .chat-hd .cav{background:rgba(255,255,255,.22)}
  .chat-hd .spacer{flex:1}
  .chname{font-weight:700;font-size:13px;line-height:1.15}
  .chsub{font-size:10.5px;opacity:.85}
  .chx{cursor:pointer;opacity:.85;display:inline-flex}
  .chx:hover{opacity:1}
  .chat-bd{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:7px;background:var(--soft)}
  .cmsg{max-width:82%;padding:8px 11px;border-radius:13px;font-size:12.8px;line-height:1.42;word-wrap:break-word}
  .cmsg.me{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:4px}
  .cmsg.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:4px}
  .cmsg .ct{font-size:9.5px;opacity:.6;margin-top:3px}
  .cpub{font-size:10px;font-weight:700;opacity:.85;margin-bottom:3px;display:flex;align-items:center;gap:3px}
  .chat-empty{color:var(--muted);font-size:12px;text-align:center;margin:auto;padding:20px;line-height:1.5}
  .chat-ft{border-top:1px solid var(--line);padding:8px;background:var(--card)}
  .cbcast{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-bottom:6px;cursor:pointer}
  .cinrow{display:flex;gap:6px}

const SWEC_FLAT=(function(){const m={};(function walk(nodes,parent,path){nodes.forEach(n=>{const p=path.concat(n.name);m[n.code]={code:n.code,name:n.name,parent:parent,path:p,level:p.length,children:(n.children||[]).map(c=>c.code),leaf:!n.children};walk(n.children||[],n.code,p);});})(SWEC_TREE,null,[]);return m;})();
function swecNode(c){return SWEC_FLAT[c];}
function swecLabel(c){return SWEC_FLAT[c]?SWEC_FLAT[c].name:c;}
function swecPath(c){return SWEC_FLAT[c]?SWEC_FLAT[c].path.join(' › '):c;}
function swecDesc(c){const out=[c];const n=SWEC_FLAT[c];if(n)n.children.forEach(ch=>out.push(...swecDesc(ch)));return out;}
function swecLeaves(c){return swecDesc(c).filter(x=>SWEC_FLAT[x]&&SWEC_FLAT[x].leaf);}
function vendorMatchesCats(v,codes,mode){if(!codes||!codes.length)return true;const has=c=>{const set=swecDesc(c);return (v.swec||[]).some(t=>set.includes(t));};return mode==='and'?codes.every(has):codes.some(has);}

        <tbody>${DATA.rfqs.map(r=>{const [bc,bl]=statusBadge(r.status);return `
          <tr>
            <td style="font-weight:700;color:var(--teal)">${r.id}</td>

}
function procReqs(){
  S.reqF = S.reqF || {requestor:[],dept:[],loc:[],job:[],cat:[],status:'avail'};
  S.reqExpand = S.reqExpand || {};
  S.reqGroup = S.reqGroup || {};
  S.lineSel = S.lineSel || {};
  const F=S.reqF;
  const lstat=l=>l.status||'available';
  const avail=pr=>reqAvail(pr);
  const uniq=k=>{const s=[];DATA.prs.forEach(p=>{const v=p[k]||'';if(v&&!s.includes(v))s.push(v);});return s;};
  const list=reqFilteredList();
  const _groupable=list.filter(p=>avail(p).length>0);
  const allG=_groupable.length>0&&_groupable.every(p=>S.reqGroup[p.id]);
  const someG=_groupable.some(p=>S.reqGroup[p.id]);
  const fsel=(k,label)=>{
    const sel=S.reqF[k]||[];
    const summ=sel.length===0?'All':sel.length===1?sel[0]:sel.length+' selected';
    const open=S.reqOpenF===k;
    const opts=uniq(k).map(v=>{const ev=(''+v).replace(/'/g,"\\'");return `<label class="mopt"><input type="checkbox" ${sel.includes(v)?'checked':''} onchange="reqFChk('${k}','${ev}',this.checked)">${v}</label>`;}).join('');
    return `<div class="msel"><label>${label}</label>
      <button class="mbtn ${sel.length?'has':''}" onclick="event.stopPropagation();reqToggleF('${k}')"><span>${summ}</span><span class="mchev ${open?'up':''}">${I('chev',12,'currentColor')}</span></button>
      ${open?`<div class="mpop" onclick="event.stopPropagation()">${opts}${sel.length?`<div class="mpopf"><button onclick="reqFClear('${k}')">Clear</button></div>`:''}</div>`:''}</div>`;
  };
  const statusSummary=pr=>{
    const a=pr.lines.filter(l=>lstat(l)==='available').length;
    const r=pr.lines.filter(l=>lstat(l)==='rfq').length;
    const c=pr.lines.length-a-r;
    let h='';
    if(a)h+=`<span class="lst a"><span class="d"></span>${a}</span>`;
    if(r)h+=`<span class="lst r"><span class="d"></span>${r}</span>`;
    if(c)h+=`<span class="lst c"><span class="d"></span>${c}</span>`;
    return h||'<span class="hint">&mdash;</span>';
  };
  const lineDrawer=pr=>{
    const lrows=pr.lines.map((l,i)=>{
      const st=lstat(l);const indraft=reqInDraft(pr.id+':'+i);
      const chip=indraft?`<span class="lst a"><span class="d" style="background:var(--teal)"></span>In this RFQ</span>`:(st==='available'?'<span class="lst a"><span class="d"></span>Available</span>':st==='rfq'?`<span class="lst r"><span class="d"></span>${l.ref||'In RFQ'}</span>`:`<span class="lst c"><span class="d"></span>${l.ref||'Closed'}</span>`);
      return `<tr><td>${l.code}</td><td>${l.item}</td><td class="amt">${l.qty}</td><td>${l.uom}</td><td class="amt">${fmt(l.rate||0)}</td><td class="amt">${fmt(l.qty*(l.rate||0))}</td><td>${chip}</td></tr>`;
    }).join('');
    return `<table class="linetab"><thead><tr><th>Item</th><th>Description</th><th class="amt">Qty</th><th>UoM</th><th class="amt">Est. rate</th><th class="amt">Est. amount</th><th>Status</th></tr></thead><tbody>${lrows}</tbody></table>`;
  };
  const grouped=DATA.prs.filter(p=>S.reqGroup[p.id]);
  const gLines=grouped.reduce((n,p)=>n+avail(p).length,0);
  const abar=grouped.length
    ? `<div class="abar2 live"><span class="info"><b>${grouped.length}</b> PR grouped &middot; <b>${gLines}</b> available lines</span><span class="sp"></span><button class="btn btn-pri" onclick="reqOpenDrawer()">${I('rfq',15,'#fff')} Confirm lines</button></div>`
    : `<div class="abar2"><span class="info">Tick the PRs you want to source, then confirm which lines go into the RFQ.</span><span class="sp"></span><button class="btn btn-pri" disabled>${I('rfq',15,'#fff')} Confirm lines</button></div>`;
  const rows=list.map(pr=>{
    const op=S.reqExpand[pr.id], g=S.reqGroup[pr.id], canG=avail(pr).length>0;
    let h=`<tr class="prrow ${op?'open':''} ${g?'grp':''}" onclick="reqExpand('${pr.id}',event)">
      <td style="width:34px"><input type="checkbox" onclick="event.stopPropagation();reqGroupChk('${pr.id}',this.checked)" ${g?'checked':''} ${canG?'':'disabled'}></td>
      <td><span class="chev">${I('chev',13,'currentColor')}</span> <span class="prid">${pr.id}</span></td>
      <td>${pr.requestor}</td><td>${pr.dept}</td><td title="${pr.memo||''}">${pr.loc||''}</td><td>${pr.job||''}</td><td>${pr.cat||''}</td><td>${pr.need}</td>
      <td>${statusSummary(pr)}</td></tr>`;
    if(op)h+=`<tr><td colspan="9" style="padding:0;background:#fbfbf9">${lineDrawer(pr)}</td></tr>`;
    return h;
  }).join('') || '<tr><td colspan="9" style="padding:24px;text-align:center;color:var(--muted)">No PRs match these filters.</td></tr>';
  let drawerHTML='';
  if(S.reqDrawer){
    let body='';
    grouped.forEach(pr=>{
      let lr='';
      pr.lines.forEach((l,i)=>{
        const key=pr.id+':'+i;
        if(reqSelectable(pr,i)){
          lr+=`<label class="lrow2"><input type="checkbox" ${S.lineSel[key]?'checked':''} onchange="reqLineChk('${key}',this.checked)"><span class="lc"><div class="desc">${l.item}</div><div class="sub">${l.code} &middot; ${l.qty} ${l.uom}</div></span></label>`;
        }else{
          const st=lstat(l);const lbl=reqInDraft(key)?'Already in this RFQ':(st==='rfq'?'In '+(l.ref||'RFQ'):st==='awarded'?'Awarded &middot; '+(l.ref||''):'Sourced');
          lr+=`<div class="lrow2 lock"><span style="width:15px"></span><span class="lc"><div class="desc">${l.item}</div><div class="lockchip">${I('lock',12,'var(--muted)')}${lbl}</div></span></div>`;
        }
      });
      body+=`<div class="psec2"><div class="ph"><span class="pid">${pr.id}</span><span class="pc">${pr.requestor} &middot; ${pr.cat||''}</span><button class="selall" onclick="reqSelAll('${pr.id}')">Select all available</button></div>${lr}</div>`;
    });
    let n=0,gAvail=0;
    grouped.forEach(pr=>pr.lines.forEach((l,i)=>{const key=pr.id+':'+i;if(reqSelectable(pr,i)){gAvail++;if(S.lineSel[key])n++;}}));
    const isAdd=S.reqMode==='add';
    const primary=isAdd
      ? `<button class="btn btn-pri" ${n?'':'disabled'} onclick="reqAddToDraft()">Add ${n} ${n===1?'line':'lines'} to RFQ</button>`
      : `<button class="btn btn-pri" ${n?'':'disabled'} onclick="reqCreateRFQ()">Create RFQ &rarr;</button>`;
    drawerHTML=`<div class="rqscrim" onclick="reqCloseDrawer()"></div>
      <div class="rqdrawer">
        <div class="dh">${I('rfq',18,'var(--teal)')}<h3>${isAdd?'Add lines to RFQ':'Select lines for RFQ'}</h3><button class="x" onclick="reqCloseDrawer()">&times;</button></div>
        <div class="dsub"><span class="lbl">${gAvail} available ${gAvail===1?'line':'lines'} across ${grouped.length} ${grouped.length===1?'PR':'PRs'}</span><span class="sp"></span><button onclick="reqMarkAll()">Mark all</button><button onclick="reqUnmarkAll()">Unmark all</button></div>
        <div class="db">${body||'<div style="padding:24px;color:var(--muted)">No grouped PRs.</div>'}</div>
        <div class="df"><div class="note">${I('eye',13,'var(--muted)')} Unticked lines stay available for future RFQs.</div>
          <div class="frow"><span class="tot">${n} ${n===1?'line':'lines'} selected</span><span class="sp"></span>
          <button class="btn btn-out" onclick="reqCloseDrawer()">Cancel</button>
          ${primary}</div></div>
      </div>`;
  }
  const gridInner=`
    ${S.reqOpenF?'<div class="mscrim" onclick="reqCloseF()"></div>':''}
    <div class="fbar2">
      ${fsel('requestor','Requestor')}${fsel('dept','Dept')}${fsel('loc','Location')}${fsel('job','Job')}${fsel('cat','Category')}
      <div class="fitem2"><label>Show</label><select onchange="reqSetStatus(this.value)"><option value="avail" ${F.status==='avail'?'selected':''}>With available lines</option><option value="all" ${F.status==='all'?'selected':''}>All PRs</option></select></div>
      <button class="freset" onclick="reqReset()">Reset</button>
    </div>
    ${abar}
    <div class="rqtools"><button class="freset" onclick="reqExpandAll()">Expand all</button><button class="freset" onclick="reqCollapseAll()">Collapse all</button></div>
    <div class="card rq"><table>
      <colgroup><col style="width:4%"><col style="width:13%"><col style="width:13%"><col style="width:10%"><col style="width:12%"><col style="width:11%"><col style="width:13%"><col style="width:11%"><col style="width:13%"></colgroup>
      <thead><tr><th><input type="checkbox" id="prAll" onclick="reqSelectAll(this.checked)"></th><th>PR #</th><th>Requestor</th><th>Dept</th><th>Location</th><th>Job</th><th>Category</th><th>Required by</th><th>Lines</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  if(S.reqMode==='add'){
    const host=document.getElementById('addhost');
    if(host)host.innerHTML=`<div class="addscrim" onclick="reqCloseAdd()"></div><div class="adddrawer"><div class="dh">${I('rfq',18,'var(--teal)')}<h3>Add PRs to This RFQ</h3><button class="x" onclick="reqCloseAdd()">&times;</button></div><div class="adddb">${gridInner}</div></div>${drawerHTML}`;
  }else{
    $('main').innerHTML=`
    <div class="pagehead"><div><h1>Requisitions</h1><p>Approved Purchase Requests from NetSuite. Group PRs, then pick the exact lines to source.</p></div></div>
    <div class="ribbon"><span class="ns">${I('box',12,'#fff')}NetSuite</span> Showing approved PR lines. Sourced lines are locked to their RFQ. Last sync 2 min ago.</div>
    ${gridInner}
    ${drawerHTML}`;
  }
  const _pa=document.getElementById('prAll'); if(_pa){_pa.checked=allG; _pa.indeterminate=someG&&!allG;}
}

function reqInDraft(key){return S.reqMode==='add'&&S.draft&&S.draft.lines.some(l=>l.lineKey===key);}
function reqSelectable(pr,i){const l=pr.lines[i];if((l.status||'available')!=='available')return false;if(reqInDraft(pr.id+':'+i))return false;return true;}
function reqAvail(pr){return pr.lines.filter((l,i)=>reqSelectable(pr,i));}
function reqFilteredList(){const F=S.reqF||{};const inA=(a,v)=>!a||!a.length||a.includes(v);return DATA.prs.filter(p=>{if(!inA(F.requestor,p.requestor))return false;if(!inA(F.dept,p.dept))return false;if(!inA(F.loc,p.loc||''))return false;if(!inA(F.job,p.job||''))return false;if(!inA(F.cat,p.cat||''))return false;if((F.status||'avail')==='avail'&&reqAvail(p).length===0)return false;return true;});}
function reqToggleF(k){S.reqOpenF=(S.reqOpenF===k?null:k);procReqs();}
function reqFChk(k,v,c){S.reqF=S.reqF||{};const a=S.reqF[k]=S.reqF[k]||[];const i=a.indexOf(v);if(c){if(i<0)a.push(v);}else if(i>=0)a.splice(i,1);procReqs();}
function reqFClear(k){S.reqF[k]=[];procReqs();}
function reqCloseF(){S.reqOpenF=null;procReqs();}
function reqSetStatus(v){S.reqF=S.reqF||{};S.reqF.status=v;procReqs();}
function reqSelectAll(c){S.reqGroup=S.reqGroup||{};reqFilteredList().forEach(pr=>{if(reqAvail(pr).length>0)S.reqGroup[pr.id]=c;});procReqs();}
function reqReset(){S.reqF={requestor:[],dept:[],loc:[],job:[],cat:[],status:'avail'};S.reqOpenF=null;procReqs();}
function reqExpand(id,e){if(e&&e.target&&e.target.tagName==='INPUT')return;S.reqExpand=S.reqExpand||{};S.reqExpand[id]=!S.reqExpand[id];procReqs();}
function reqExpandAll(){S.reqExpand={};DATA.prs.forEach(p=>{S.reqExpand[p.id]=true;});procReqs();}
function reqCollapseAll(){S.reqExpand={};procReqs();}
function reqGroupChk(id,c){S.reqGroup=S.reqGroup||{};S.reqGroup[id]=c;procReqs();}
function reqOpenDrawer(){S.lineSel={};DATA.prs.forEach(pr=>{if(S.reqGroup[pr.id])pr.lines.forEach((l,i)=>{if(reqSelectable(pr,i))S.lineSel[pr.id+':'+i]=true;});});S.reqDrawer=true;procReqs();}
function reqCloseDrawer(){S.reqDrawer=false;procReqs();}
function reqLineChk(key,c){S.lineSel=S.lineSel||{};S.lineSel[key]=c;procReqs();}
function reqSelAll(prId){const pr=DATA.prs.find(p=>p.id===prId);if(!pr)return;const allOn=pr.lines.every((l,i)=>!reqSelectable(pr,i)||S.lineSel[prId+':'+i]);pr.lines.forEach((l,i)=>{if(reqSelectable(pr,i))S.lineSel[prId+':'+i]=!allOn;});procReqs();}
function reqMarkAll(){DATA.prs.filter(p=>S.reqGroup[p.id]).forEach(pr=>pr.lines.forEach((l,i)=>{if(reqSelectable(pr,i))S.lineSel[pr.id+':'+i]=true;}));procReqs();}
function reqUnmarkAll(){DATA.prs.filter(p=>S.reqGroup[p.id]).forEach(pr=>pr.lines.forEach((l,i)=>{if(reqSelectable(pr,i))S.lineSel[pr.id+':'+i]=false;}));procReqs();}
function reqCreateRFQ(){
  const lines=[];const prSet=[];
  DATA.prs.forEach(pr=>{if(S.reqGroup[pr.id])pr.lines.forEach((l,i)=>{const key=pr.id+':'+i;if(reqSelectable(pr,i)&&S.lineSel[key]){lines.push(Object.assign({},l,{prId:pr.id,lineKey:key}));if(!prSet.includes(pr.id))prSet.push(pr.id);}});});
  if(!lines.length)return;
  S.draft={title:'',envelope:'dual',opens:'2026-06-28',closes:'2026-07-10',currency:'MYR',prRefs:prSet,lines,form:defaultForm(),formName:'Standard Technical Questionnaire',invited:[],evaluators:[],evalCommercial:[]};
  S.reqDrawer=false;S.builderStep=0;S.procScreen='builder';render();
}
function bAddPRs(){S.reqMode='add';S.reqF={requestor:[],dept:[],loc:[],job:[],cat:[],status:'avail'};S.reqOpenF=null;S.reqExpand={};S.reqGroup={};S.lineSel={};S.reqDrawer=false;if(!document.getElementById('addhost')){const h=document.createElement('div');h.id='addhost';document.body.appendChild(h);}procReqs();}
function reqCloseAdd(){S.reqMode='screen';S.reqDrawer=false;S.reqGroup={};S.lineSel={};const h=document.getElementById('addhost');if(h)h.innerHTML='';}
function reqAddToDraft(){const add=[];DATA.prs.forEach(pr=>{if(S.reqGroup[pr.id])pr.lines.forEach((l,i)=>{const key=pr.id+':'+i;if(reqSelectable(pr,i)&&S.lineSel[key])add.push(Object.assign({},l,{prId:pr.id,lineKey:key}));});});if(!add.length)return;add.forEach(l=>{if(!S.draft.lines.some(x=>x.lineKey===l.lineKey))S.draft.lines.push(l);});S.draft.prRefs=[...new Set(S.draft.lines.map(l=>l.prId).filter(Boolean))];S.reqMode='screen';S.reqDrawer=false;S.reqGroup={};S.lineSel={};const h=document.getElementById('addhost');if(h)h.innerHTML='';render();}
function bToggleSrc(pid){S.bSrcOpen=S.bSrcOpen||{};S.bSrcOpen[pid]=!S.bSrcOpen[pid];render();}
function rfqLinesFromPR(prId){const pr=DATA.prs.find(p=>p.id===prId);return pr?pr.lines.map(l=>({...l})):[];}

function swMatch(n,kw){if(!kw)return true;if(n.name.toLowerCase().includes(kw)||n.code.toLowerCase().includes(kw))return true;return (n.children||[]).some(c=>swMatch(c,kw));}
function swPickRows(nodes,depth,sel,tog){
  S.swExpand=S.swExpand||new Set();

    const hasCh=n.children&&n.children.length;
    const open=kw?true:S.swExpand.has(n.code);
    const checked=(sel&&sel.has)?sel.has(n.code):(sel||[]).includes(n.code);
    const row=`<div class="swnode">
      <span class="swind" style="width:${depth*18}px"></span>
      <span class="swtw ${open?'open':''} ${hasCh?'':'leaf'}" ${hasCh?`onclick="swPickExpand('${n.code}')"`:''}>${hasCh?I('chev',12,'var(--muted)'):''}</span>
      <label class="swck"><input type="checkbox" ${checked?'checked':''} onchange="${tog}('${n.code}')"><span class="swnm ${hasCh?'grp':''}">${n.name}</span>${n.leaf?`<span class="swc3">${n.code}</span>`:`<span class="swcnt">${swecLeaves(n.code).length}</span>`}</label>
    </div>`;
    return row+(hasCh&&open?swPickRows(n.children,depth+1,sel,tog):'');
  }).join('');
}

function xlAOAForGroup(form,g,answers,map){
  const rows=[['Sub-group','Question','Type','Required','Answer (fill here) ->']];let r=1;
  form.items.filter(it=>it.group===g).forEach(it=>{
    const sec=it.section||'';
    if(it.kind==='instruction'){rows.push(['','INSTRUCTION: '+(it.label||''),'','','']);r++;return;}
    if(it.kind==='terms'){rows.push([sec,'TERMS: '+(it.label||''),'Terms',it.required?'Yes':'No',(answers&&answers[it.id]&&answers[it.id].accept)?'I ACCEPT':'']);map.push({sheet:g,r:r,c:4,kind:'terms',qid:it.id});r++;return;}
    const tl=qTypeLabel(it.type);
    if(it.type==='attachment'){rows.push([sec,it.label,tl,it.required?'Yes':'No','(upload in portal)']);r++;return;}
    if(it.type==='table'){const cols=it.config.columns||[],trows=it.config.rows||[];const tv=(answers&&answers[it.id])||[];
      rows.push([sec,'TABLE: '+it.label,tl,it.required?'Yes':'No','']);r++;
      rows.push(['','Row \\ Column','','',...cols]);r++;
      trows.forEach((rl,ri)=>{const cells=cols.map((cl,ci)=>(tv[ri]&&tv[ri][ci]!=null)?tv[ri][ci]:'');rows.push(['',rl,'','',...cells]);cols.forEach((cl,ci)=>map.push({sheet:g,r:r,c:4+ci,kind:'tablecell',qid:it.id,i:ri,j:ci}));r++;});return;}
    if(it.type==='group'){const fields=it.config.fields||[],max=it.config.max||3;const gv=(answers&&answers[it.id])||[];
      rows.push([sec,'REPEATABLE: '+it.label+' (up to '+max+')',tl,it.required?'Yes':'No','']);r++;
      for(let e=0;e<max;e++){rows.push(['','Entry '+(e+1),'','','']);r++;fields.forEach((f,fi)=>{const val=(gv[e]&&gv[e][fi]!=null)?gv[e][fi]:'';rows.push(['',f.label,'','',val]);map.push({sheet:g,r:r,c:4,kind:'groupcell',qid:it.id,i:e,j:fi});r++;});}return;}
    let val=answers?answers[it.id]:'';let kind='scalar';
    if(it.type==='multi'){kind='multi';val=Array.isArray(val)?val.join(', '):'';}
    else if(it.type==='yesno'){kind='yesno';val=val?String(val):'';}
    else if(it.type==='list'){kind='list';val=(val==null?'':val);}
    else {val=(val==null?'':val);}
    rows.push([sec,it.label,tl,it.required?'Yes':'No',val]);map.push({sheet:g,r:r,c:4,kind:kind,qid:it.id});r++;
  });
  return rows;
}

  const map=[];meta=meta||{};

  const Technical=xlAOAForGroup(form,'technical',answers,map);
  const Guide=[['eProcure — vendor response template'],[''],['Form',meta.name||''],['Form ID',meta.formId||''],['Version',meta.version||''],[''],

function xlParse(form,sheets){
  const map=[];xlAOAForGroup(form,'commercial',null,map);xlAOAForGroup(form,'technical',null,map);
  const ans={};
  map.forEach(m=>{const sh=sheets[m.sheet==='commercial'?'Commercial':'Technical'];const row=sh&&sh[m.r];const v=(row&&row[m.c]!=null)?row[m.c]:'';
    if(m.kind==='multi')ans[m.qid]=String(v).split(',').map(s=>s.trim()).filter(Boolean);
    else if(m.kind==='terms')ans[m.qid]={accept:/accept|yes|true|^x$/i.test(String(v).trim())};
    else if(m.kind==='tablecell'){ans[m.qid]=ans[m.qid]||[];ans[m.qid][m.i]=ans[m.qid][m.i]||[];ans[m.qid][m.i][m.j]=(''+v);}
    else if(m.kind==='groupcell'){ans[m.qid]=ans[m.qid]||[];ans[m.qid][m.i]=ans[m.qid][m.i]||[];ans[m.qid][m.i][m.j]=(''+v);}
    else ans[m.qid]=(''+v);
  });

}

function qDelOption(id,oi){const it=qFind(id);if(it&&it.config.options)it.config.options.splice(oi,1);render();}
function qAddCol(id){const it=qFind(id);it.config.columns=it.config.columns||[];it.config.columns.push('Column '+(it.config.columns.length+1));render();}
function qSetCol(id,ci,v){const it=qFind(id);if(it.config.columns)it.config.columns[ci]=v;}
function qDelCol(id,ci){const it=qFind(id);it.config.columns.splice(ci,1);render();}
function qAddRow(id){const it=qFind(id);it.config.rows=it.config.rows||[];it.config.rows.push('Row '+(it.config.rows.length+1));render();}
function qSetRow(id,ri,v){const it=qFind(id);if(it.config.rows)it.config.rows[ri]=v;}
function qDelRow(id,ri){const it=qFind(id);it.config.rows.splice(ri,1);render();}
function qAddField(id){const it=qFind(id);it.config.fields=it.config.fields||[];it.config.fields.push({label:'Field '+(it.config.fields.length+1),type:'short_text'});render();}
function qSetField(id,fi,k,v){const it=qFind(id);if(it.config.fields&&it.config.fields[fi]){it.config.fields[fi][k]=v;if(k==='type')render();}}
function qDelField(id,fi){const it=qFind(id);it.config.fields.splice(fi,1);render();}
function qAddSection(g){qForm().sections[g]=qForm().sections[g]||[];qForm().sections[g].push('New sub-group');render();}
function qRenameSection(g,si,v){const arr=qForm().sections[g];const old=arr[si];arr[si]=v;qForm().items.forEach(it=>{if(it.group===g&&it.section===old)it.section=v;});render();}
function qDelSection(g,si){const arr=qForm().sections[g];const name=arr[si];arr.splice(si,1);qForm().items.forEach(it=>{if(it.group===g&&it.section===name)it.section='';});render();}
function qLoadForm(name){const lib=qLibrary();if(lib[name]){S.draft.form=lib[name]();S.draft.formName=name;S.qItemOpen=null;S.qAddMenu=null;}render();}

function procBuilder(){
  const d=S.draft;const step=S.builderStep;
  const labels=['Items','RFQ settings','Questions','Vendors',d.envelope==='dual'?'Evaluators':'Review','Review'];
  const steps=d.envelope==='dual'?['Items','Settings','Questions','Vendors','Evaluators','Review']:['Items','Settings','Questions','Vendors','Review'];
  const stepHTML=steps.map((s,i)=>`<div class="step ${i===step?'on':i<step?'done':''}"><span class="n">${i<step?'✓':i+1}</span>${s}</div>`+(i<steps.length-1?'<span class="sep"></span>':'')).join('');
  let body='';
  if(step===0){
    const srcIds=[...new Set(d.lines.map(l=>l.prId).filter(Boolean))];
    let prevPr=null;
    const rfqRows=d.lines.map((l,i)=>{
      const first=l.prId!==prevPr&&i>0;prevPr=l.prId;
      return `<tr class="${first?'firstof':''}"><td><span class="prtag">${l.prId||'—'}</span></td><td>${l.code}</td><td>${l.item}</td><td class="amt">${l.qty}</td><td>${l.uom}</td><td class="amt"><span style="cursor:pointer;color:var(--red)" title="Remove line" onclick="bDelLine(${i})">${I('x',15,'var(--red)')}</span></td></tr>`;
    }).join('');
    const srcCards=srcIds.map(pid=>{
      const pr=DATA.prs.find(p=>p.id===pid);if(!pr)return '';
      const open=S.bSrcOpen&&S.bSrcOpen[pid];
      const inCount=pr.lines.filter((l,i)=>d.lines.some(x=>x.lineKey===pid+':'+i)).length;
      const lrows=pr.lines.map((l,i)=>{
        const isIn=d.lines.some(x=>x.lineKey===pid+':'+i);
        const mark=isIn?`<span class="inmark">${I('check',13,'currentColor')} In this RFQ</span>`:((l.status||'available')==='available'?`<span class="outmark"><span class="dd"></span>Available, not added</span>`:`<span class="hint">${l.ref||'Sourced'}</span>`);
        return `<tr class="${isIn?'':'out'}"><td>${l.code}</td><td>${l.item}</td><td class="amt">${l.qty}</td><td>${l.uom}</td><td>${mark}</td></tr>`;
      }).join('');
      return `<div class="prc ${open?'open':''}"><div class="prh" onclick="bToggleSrc('${pid}')"><span class="chev">${I('chev',13,'currentColor')}</span><span class="pid">${pr.id}</span><span class="who">${pr.requestor} &middot; ${pr.dept} &middot; ${pr.loc||''}</span><span class="sp"></span><span class="inb">${inCount} of ${pr.lines.length} lines in this RFQ</span></div>${open?`<div class="prb"><div class="meta"><div><div class="k">Memo</div><div class="v">${pr.memo||'—'}</div></div><div><div class="k">Job</div><div class="v">${pr.job||'—'}</div></div><div><div class="k">Category</div><div class="v">${pr.cat||'—'}</div></div><div><div class="k">Raised</div><div class="v">${pr.date||'—'}</div></div><div><div class="k">Required by</div><div class="v">${pr.need||'—'}</div></div><div><div class="k">Requestor</div><div class="v">${pr.requestor}</div></div></div><table class="mlt"><thead><tr><th>Item</th><th>Description</th><th class="amt">Qty</th><th>UoM</th><th>In RFQ</th></tr></thead><tbody>${lrows}</tbody></table></div>`:''}</div>`;
    }).join('');
    body=`<div class="card"><div class="chead"><h3>RFQ Line Items</h3><div class="spacer"></div><span class="hint">${d.lines.length} ${d.lines.length===1?'line':'lines'} from ${srcIds.length} PR${srcIds.length!==1?'s':''}</span><button class="btn btn-out btn-sm" style="margin-left:12px" onclick="bAddPRs()">${I('plus',15)} Add PRs</button></div>
      <table class="rfqlt"><thead><tr><th>PR #</th><th>Item</th><th>Description</th><th class="amt">Qty</th><th>UoM</th><th></th></tr></thead>
      <tbody>${rfqRows||'<tr><td colspan="6" style="padding:22px;text-align:center;color:var(--muted)">No lines yet. Use Add PRs to pull requisition lines.</td></tr>'}</tbody></table></div>
      <div class="srcsec">Source requisitions</div>${srcCards||'<p class="hint">No source requisitions.</p>'}`;
  }else if(step===1){
    body=`<div class="card"><div class="cbody">
      <div class="field"><label>RFQ title</label><input type="text" id="bTitle" value="${d.title}" placeholder="e.g. Pump & VFD Package — Facilities Upgrade"></div>
      <div class="grid g2">
        <div class="field"><label>Bid Open Date</label><input type="date" id="bOpens" value="${d.opens||''}"></div>
        <div class="field"><label>Bid Close Date</label><input type="date" id="bCloses" value="${d.closes}"></div>
      </div>
      <div class="grid g2">
        <div class="field"><label>Currency</label><select id="bCurrency">${['MYR','USD','SGD','EUR','GBP','JPY','CNY','AUD'].map(c=>`<option ${(d.currency||'MYR')===c?'selected':''}>${c}</option>`).join('')}</select></div>
        <div></div>
      </div>
      <div class="field"><label>Envelope type</label>
        <div class="grid g2" style="gap:12px">
          <div class="env ${d.envelope==='single'?'':''}" style="cursor:pointer;border-color:${d.envelope==='single'?'var(--teal)':'var(--line)'}" onclick="bSetEnv('single')">
            <div class="ebody"><div style="display:flex;align-items:center;gap:10px"><input type="radio" ${d.envelope==='single'?'checked':''}> <strong>Single envelope</strong></div>
            <p class="hint" style="margin:8px 0 0">Commercial &amp; technical opened together when bids close.</p></div></div>
          <div class="env" style="cursor:pointer;border-color:${d.envelope==='dual'?'var(--teal)':'var(--line)'}" onclick="bSetEnv('dual')">
            <div class="ebody"><div style="display:flex;align-items:center;gap:10px"><input type="radio" ${d.envelope==='dual'?'checked':''}> <strong>Dual envelope</strong> <span class="badge b-blue">Sealed</span></div>
            <p class="hint" style="margin:8px 0 0">Technical opened &amp; scored first by assigned evaluators; commercial stays sealed until technical pass.</p></div></div>
        </div>
      </div></div></div>`;
  }else if(step===2){
    body=bQuestions(d);
  }else if(step===3){
    body=bInviteStep(d);
  }else if(step===4 && d.envelope==='dual'){
    const evRow=(ev,on,tog,lbl)=>`<div class="env" style="margin-bottom:10px;border-color:${on?'var(--teal)':'var(--line)'};cursor:pointer" onclick="${tog}('${ev.id}')">
          <div class="ebody" style="display:flex;align-items:center;gap:12px">
            <input type="checkbox" class="check" ${on?'checked':''}>
            <div style="flex:1"><div style="font-weight:700">${ev.name}</div><div class="hint">${ev.area}</div></div>
            ${on?`<span class="badge b-blue">${lbl}</span>`:''}
          </div></div>`;
    body=`<div class="card" style="margin-bottom:14px"><div class="chead"><h3>Technical Envelope — Assigned Evaluators</h3></div>
      <div class="cbody"><p class="hint" style="margin-top:0">Only assigned evaluators can open and score the sealed technical envelope.</p>
      ${DATA.evaluators.map(ev=>evRow(ev,d.evaluators.includes(ev.id),'bToggleEv','Can open technical')).join('')}</div></div>
      <div class="card"><div class="chead"><h3>Commercial Envelope — Assigned Evaluators</h3></div>
      <div class="cbody"><p class="hint" style="margin-top:0">Assigned evaluators open and evaluate the commercial envelope after technical scoring is complete.</p>
      ${DATA.evaluators.map(ev=>evRow(ev,(d.evalCommercial||[]).includes(ev.id),'bToggleEvC','Can open commercial')).join('')}</div></div>`;
  }else{ // review
    body=`<div class="card"><div class="chead"><h3>Review &amp; Send</h3></div><div class="cbody">
      <div class="grid g2">
        <div><div class="hint">Title</div><div style="font-weight:700;margin-bottom:10px">${d.title||'—'}</div></div>
        <div><div class="hint">Bid window</div><div style="font-weight:700;margin-bottom:10px">${d.opens||'—'} → ${d.closes||'—'}</div></div>
        <div><div class="hint">Currency</div><div style="font-weight:700;margin-bottom:10px">${d.currency||'MYR'}</div></div>
        <div><div class="hint">Envelope</div><div style="font-weight:700;margin-bottom:10px">${d.envelope==='dual'?'Dual (sealed technical + commercial)':'Single'}</div></div>
        <div><div class="hint">Lines / Questions</div><div style="font-weight:700;margin-bottom:10px">${d.lines.length} lines · ${(d.form?d.form.items.filter(x=>x.kind==='question').length:0)} questions</div></div>
      </div>
      <div class="hint" style="margin-bottom:6px">Vendors (${d.invited.length})</div>
      <div>${d.invited.map(id=>`<span class="chip">${venById(id).name}</span>`).join('')||'<span class="hint">None selected</span>'}</div>
      ${d.envelope==='dual'?`<div class="hint" style="margin:12px 0 6px">Technical evaluators</div><div>${d.evaluators.map(id=>`<span class="chip">${I('lock',13)} ${DATA.evaluators.find(e=>e.id===id).name}</span>`).join('')||'<span class="hint">None assigned</span>'}</div><div class="hint" style="margin:12px 0 6px">Commercial evaluators</div><div>${(d.evalCommercial||[]).map(id=>`<span class="chip">${I('lock',13)} ${DATA.evaluators.find(e=>e.id===id).name}</span>`).join('')||'<span class="hint">None assigned</span>'}</div>`:''}
    </div></div>`;
  }
  const last=steps.length-1;
  const bActions=`${step>0?`<button class="btn btn-out" onclick="bPrev()">${I('back',15)} Back</button>`:''}<button class="btn btn-out" onclick="bSaveDraft()">${I('doc',15)} Save as draft</button>${step<last?`<button class="btn btn-pri" onclick="bNext()">Continue ${I('chev',15,'#fff')}</button>`:`<button class="btn btn-pri" onclick="bConfirmRelease()">${I('send',15,'#fff')} Release to ${d.invited.length} vendor${d.invited.length!==1?'s':''}</button>`}`;
  $('main').innerHTML=`
    <div class="crumb"><a onclick="goProc('reqs')">Requisitions</a> ${I('chev',13)} <span>New RFQ</span></div>
    <div class="pagehead"><div><h1>Create RFQ</h1><p>From ${d.prRefs.join(', ')}</p></div><div class="spacer"></div><div class="actbar">${bActions}</div></div>
    <div class="steps">${stepHTML}</div>
    ${body}
    <div style="display:flex;gap:10px;margin-top:18px;align-items:center">
      <span class="hint">${I('doc',13)} ${d.id?`Draft <b>${d.id}</b> — not released to vendors yet`:'Not saved yet'}</span>
      <div style="flex:1"></div>
      ${step>0?`<button class="btn btn-out" onclick="bPrev()">${I('back',15)} Back</button>`:''}
      <button class="btn btn-out" onclick="bSaveDraft()">${I('doc',15)} Save as draft</button>
      ${step<last?`<button class="btn btn-pri" onclick="bNext()">Continue ${I('chev',15,'#fff')}</button>`
        :`<button class="btn btn-pri" onclick="bConfirmRelease()">${I('send',15,'#fff')} Release to ${d.invited.length} vendor${d.invited.length!==1?'s':''}</button>`}
    </div>`;
  if(step===1){$('bTitle').oninput=e=>d.title=e.target.value;$('bCloses').onchange=e=>d.closes=e.target.value;$('bOpens').onchange=e=>d.opens=e.target.value;$('bCurrency').onchange=e=>d.currency=e.target.value;}
}
function bDelLine(i){S.draft.lines.splice(i,1);render();}
function bSetEnv(v){S.draft.envelope=v;render();}
function selF(){if(!S.selF)S.selF={q:'',groups:[[]],active:0,region:'all',state:'all',type:'all',catOpen:false};if(!S.selF.groups||!S.selF.groups.length)S.selF.groups=[[]];if(S.selF.active==null||S.selF.active>=S.selF.groups.length)S.selF.active=0;return S.selF;}
function vendorMatchesGroups(v,groups){const act=groups.filter(g=>g.length);if(!act.length)return true;const has=c=>{const set=swecDesc(c);return (v.swec||[]).some(t=>set.includes(t));};return act.some(g=>g.every(has));}
function selFilteredVendors(){const f=selF();let list=DATA.vendors.filter(v=>v.status!=='Inactive');
  if(f.type!=='all')list=list.filter(v=>v.type===f.type);
  if(f.region!=='all')list=list.filter(v=>v.region===f.region);
  if(f.state!=='all')list=list.filter(v=>v.state===f.state);
  if(f.q)list=list.filter(v=>v.regName.toLowerCase().includes(f.q.toLowerCase()));
  return list.filter(v=>vendorMatchesGroups(v,f.groups));}
function bInviteStep(d){
  S.swCtx='filter';const f=selF();
  const states=[...new Set(DATA.vendors.map(v=>v.state))].sort();
  const list=selFilteredVendors();
  const matchedDesc=new Set();f.groups.forEach(g=>g.forEach(c=>swecDesc(c).forEach(x=>matchedDesc.add(x))));
  const nGroups=f.groups.filter(g=>g.length).length;
  const opt=(arr,sel,allLbl)=>[`<option value="all">${allLbl}</option>`].concat(arr.map(o=>`<option value="${o}" ${o===sel?'selected':''}>${o}</option>`)).join('');
  const groupsHTML=f.groups.map((g,gi)=>{
    const chips=g.length?g.map((c,ci)=>`<span class="swchip" style="cursor:pointer" title="${swecPath(c)}" onclick="event.stopPropagation();selRemoveCat(${gi},'${c}')">${swecLabel(c)} ${I('x',11,'var(--teal-d)')}</span>${ci<g.length-1?'<span class="andsep">and</span>':''}`).join(''):'<span class="hint" style="font-size:12px">empty — tick categories</span>';
    return `<span class="grpbox ${gi===f.active?'active':''}" onclick="selSetActiveGroup(${gi})">${chips}${f.groups.length>1?`<span class="grpdel" onclick="event.stopPropagation();selRemoveGroup(${gi})">${I('x',12,'var(--muted)')}</span>`:''}</span>`+(gi<f.groups.length-1?'<span class="orsep">or</span>':'');
  }).join('');
  const rows=list.map(v=>{const on=d.invited.includes(v.id);
    const chips=(v.swec||[]).map(c=>`<span class="swchip ${matchedDesc.has(c)?'hit':''}">${swecLabel(c)}</span>`).join('');
    return `<div class="vpick ${on?'on':''}" onclick="bToggleV('${v.id}')">
      <span class="vck">${on?I('check',12,'#fff'):''}</span>
      <div style="flex:1;min-width:0"><div style="font-weight:700">${v.name} ${vTypeBadge(v)}</div><div class="hint">${v.code} · ${v.state} · ${v.region} · ★ ${v.rating}</div><div style="margin-top:5px">${chips}</div></div>
      <div class="hint" style="text-align:right;white-space:nowrap">OTD ${v.perf.otd}%<br>${v.perf.lead}w lead</div></div>`;}).join('')
    ||'<div class="empty" style="padding:26px">No vendors match these filters.</div>';
  return `
    <div class="card" style="margin-bottom:12px"><div class="cbody">
      <div class="filterhead" style="display:flex;align-items:center;gap:10px">
        <strong style="font-size:13px">Filters</strong>${f.collapsed?`<span class="hint" style="font-size:12px">${selSummary(f,nGroups)}</span>`:''}
        <div style="flex:1"></div>${(!f.collapsed&&selActiveCount(f,nGroups))?`<button class="btn btn-ghost btn-sm" onclick="selResetFilters()">Reset filters</button>`:''}
        <button class="btn btn-ghost btn-sm" onclick="selToggleFilters()">${f.collapsed?'Show':'Hide'} filters <span class="fcaret ${f.collapsed?'':'open'}">${I('chev',13)}</span></button>
      </div>
      ${f.collapsed?'':`<div style="margin-top:12px">
      <div class="grid" style="grid-template-columns:1.6fr 1fr 1fr 1fr;gap:10px;align-items:end;margin-bottom:11px">
        <div class="field" style="margin:0"><label>Search vendor</label><input type="text" value="${(f.q||'').replace(/"/g,'&quot;')}" placeholder="Vendor name" oninput="selSetF('q',this.value)"></div>
        <div class="field" style="margin:0"><label>Region</label><select onchange="selSetF('region',this.value)">${opt(['Peninsular','Sarawak','Sabah'],f.region,'All regions')}</select></div>
        <div class="field" style="margin:0"><label>State</label><select onchange="selSetF('state',this.value)">${opt(states,f.state,'All states')}</select></div>
        <div class="field" style="margin:0"><label>Type</label><select onchange="selSetF('type',this.value)"><option value="all">All</option><option value="SWEC" ${f.type==='SWEC'?'selected':''}>SWEC</option><option value="Non-SWEC" ${f.type==='Non-SWEC'?'selected':''}>Non-SWEC</option></select></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <button class="btn btn-out btn-sm" onclick="selToggleCat()">${I('split',14)} SWEC categories${nGroups?` · ${f.groups.reduce((n,g)=>n+g.length,0)} tag(s)`:''} ${I('chev',13)}</button>
        <span class="hint" style="font-size:12px">Vendors match <b>all</b> categories in a group, and <b>any</b> group overall.</span>
        <div style="flex:1"></div>${nGroups?`<button class="btn btn-ghost btn-sm" onclick="selClearCats()">Clear</button>`:''}
      </div>
      <div class="grpwrap">${groupsHTML}<button class="btn btn-out btn-sm grpadd" onclick="selAddGroup()">${I('plus',13)} OR group</button></div>
      ${f.catOpen?`<div class="cattree"><div class="hint" style="font-size:11.5px;margin:8px 0 2px">Ticked categories go into the <b>highlighted</b> group above.</div><div class="field" style="margin:6px 0 8px"><input type="text" placeholder="Search category, e.g. pump, valve, switchgear" value="${(S.swKw||'').replace(/"/g,'&quot;')}" oninput="S.swKw=this.value;render()"></div><div class="swtree">${swPickRows(SWEC_TREE,0,f.groups[f.active],'filtCatTog')||'<p class="hint" style="padding:8px">No category matches.</p>'}</div></div>`:''}
      `}
    </div></div>
    <div class="card"><div class="chead"><h3>Vendors</h3><div class="spacer"></div><span class="hint" style="margin-right:8px">${list.length} shown · ${d.invited.length} selected${nGroups?` · ${nGroups} category group(s)`:''}</span><button class="btn btn-ghost btn-sm" onclick="selAllShown()">Select all shown</button>${d.invited.length?`<button class="btn btn-ghost btn-sm" onclick="selClearInvited()">Unselect all</button>`:''}</div>
      <div class="cbody" style="display:flex;flex-direction:column;gap:8px">${rows}</div></div>
    ${d.invited.length?`<div class="card" style="margin-top:12px"><div class="cbody"><div class="hint" style="margin-bottom:6px;font-weight:700">Invited (${d.invited.length})</div><div>${d.invited.map(id=>`<span class="chip" style="cursor:pointer" onclick="bToggleV('${id}')">${venById(id).name} ${I('x',11)}</span>`).join('')}</div></div></div>`:''}`;
}
function selSetF(k,val){selF()[k]=val;render();}
function selToggleCat(){const f=selF();f.catOpen=!f.catOpen;S.swCtx='filter';render();}
function filtCatTog(code){const f=selF();const g=f.groups[f.active]||(f.groups[f.active]=[]);const i=g.indexOf(code);i<0?g.push(code):g.splice(i,1);render();}
function selAddGroup(){const f=selF();if(f.groups[f.active]&&f.groups[f.active].length){f.groups.push([]);f.active=f.groups.length-1;}render();}
function selSetActiveGroup(i){selF().active=i;render();}
function selRemoveGroup(i){const f=selF();f.groups.splice(i,1);if(!f.groups.length)f.groups=[[]];if(f.active>=f.groups.length)f.active=f.groups.length-1;render();}
function selRemoveCat(gi,code){const f=selF();const g=f.groups[gi];if(g){const i=g.indexOf(code);if(i>=0)g.splice(i,1);}render();}
function selClearCats(){const f=selF();f.groups=[[]];f.active=0;render();}
function selAllShown(){selFilteredVendors().forEach(v=>{if(!S.draft.invited.includes(v.id))S.draft.invited.push(v.id);});render();}
function selClearInvited(){S.draft.invited=[];render();}
function selToggleFilters(){const f=selF();f.collapsed=!f.collapsed;render();}
function selResetFilters(){const f=selF();f.q='';f.region='all';f.state='all';f.type='all';f.groups=[[]];f.active=0;render();}
function selActiveCount(f,nGroups){return (f.q?1:0)+(f.region!=='all'?1:0)+(f.state!=='all'?1:0)+(f.type!=='all'?1:0)+(nGroups?1:0);}
function selSummary(f,nGroups){const a=[f.q?('\u201c'+f.q+'\u201d'):null,f.region!=='all'?f.region:null,f.state!=='all'?f.state:null,f.type!=='all'?f.type:null,nGroups?(nGroups+' category group(s)'):null].filter(Boolean);return a.length?a.join(' \u00b7 '):'No filters applied';}
function bToggleV(id){const a=S.draft.invited;a.includes(id)?a.splice(a.indexOf(id),1):a.push(id);render();}
function bToggleEv(id){const a=S.draft.evaluators;a.includes(id)?a.splice(a.indexOf(id),1):a.push(id);render();}
function bToggleEvC(id){const a=S.draft.evalCommercial||(S.draft.evalCommercial=[]);a.includes(id)?a.splice(a.indexOf(id),1):a.push(id);render();}
function bPrev(){S.builderStep--;render();}
